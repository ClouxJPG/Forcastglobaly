<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Метео</title>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    background:#050a10;
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

body{
    overflow-x:hidden;
}

.app{
    max-width:1100px;
    margin:auto;
    padding:14px;
}

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:14px;
}

.logo{
    font-size:26px;
    font-weight:800;
}

.logo span{
    color:#268cff;
}

.location{
    color:#8999aa;
    font-size:13px;
}

.search{
    display:flex;
    gap:8px;
    margin-bottom:14px;
}

.search input{
    flex:1;
    height:50px;
    border:0;
    outline:0;
    border-radius:15px;
    background:#101a26;
    color:#fff;
    padding:0 15px;
    font-size:16px;
}

.search button{
    width:52px;
    border:0;
    border-radius:15px;
    background:#268cff;
    color:#fff;
    font-size:22px;
}

.error{
    display:none;
    padding:12px;
    border-radius:13px;
    background:#35151c;
    color:#ff9ca8;
    margin-bottom:12px;
}

.current{
    background:linear-gradient(145deg,#122e4b,#09131e);
    border-radius:24px;
    padding:22px;
}

.current-top{
    display:flex;
    justify-content:space-between;
}

.city{
    font-size:27px;
    font-weight:750;
}

.date{
    margin-top:5px;
    color:#899aaa;
    font-size:13px;
}

.weather-icon{
    font-size:50px;
}

.temperature{
    margin-top:13px;
    font-size:68px;
    line-height:1;
    font-weight:750;
}

.description{
    margin-top:8px;
    font-size:18px;
    color:#c6d0da;
}

.details{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:9px;
    margin-top:23px;
}

.detail{
    padding:12px;
    border-radius:14px;
    background:rgba(255,255,255,.05);
}

.detail-title{
    color:#7f91a5;
    font-size:11px;
    margin-bottom:5px;
}

.detail-value{
    font-size:14px;
    font-weight:650;
}

.section-title{
    margin:23px 0 10px;
    font-size:20px;
    font-weight:750;
}

.forecast{
    display:flex;
    gap:9px;
    overflow-x:auto;
}

.forecast::-webkit-scrollbar{
    display:none;
}

.day{
    min-width:115px;
    padding:14px;
    text-align:center;
    border-radius:17px;
    background:#101a27;
}

.day-name{
    color:#94a5b7;
    font-size:13px;
}

.day-icon{
    margin:9px 0;
    font-size:32px;
}

.day-temp{
    font-weight:650;
}

.day-rain{
    margin-top:6px;
    color:#62aaff;
    font-size:12px;
}

/* MAP PREVIEW */

.map-preview{
    position:relative;
    height:390px;
    border-radius:22px;
    overflow:hidden;
    background:#060b12;
}

#previewMap{
    width:100%;
    height:100%;
}

.preview-label{
    position:absolute;
    z-index:1000;
    left:10px;
    top:10px;
    padding:7px 10px;
    border-radius:9px;
    background:rgba(4,9,15,.9);
    font-size:12px;
}

.open-map{
    position:absolute;
    z-index:1000;
    right:10px;
    bottom:10px;
    padding:10px 14px;
    border:0;
    border-radius:11px;
    background:rgba(4,9,15,.95);
    color:#fff;
    font-weight:650;
}

/* FULL MAP */

.fullscreen-map{
    display:none;
    position:fixed;
    inset:0;
    z-index:50000;
    background:#050a10;
}

.fullscreen-map.open{
    display:block;
}

#forecastMap{
    position:absolute;
    inset:0;
}

.map-top{
    position:absolute;
    z-index:10000;
    left:8px;
    right:8px;
    top:8px;
    display:flex;
    justify-content:space-between;
    gap:8px;
    pointer-events:none;
}

.map-layers{
    display:flex;
    gap:5px;
    overflow-x:auto;
    max-width:calc(100% - 100px);
    padding:5px;
    border-radius:13px;
    background:rgba(4,9,15,.94);
    pointer-events:auto;
}

.map-layers::-webkit-scrollbar{
    display:none;
}

.layer{
    flex-shrink:0;
    border:0;
    border-radius:9px;
    padding:9px 12px;
    background:#111d2b;
    color:#aab9c9;
}

.layer.active{
    background:#268cff;
    color:#fff;
}

.close-map{
    border:0;
    border-radius:11px;
    padding:10px 12px;
    background:rgba(4,9,15,.95);
    color:#fff;
    pointer-events:auto;
}

.legend{
    position:absolute;
    z-index:10000;
    left:10px;
    bottom:10px;
    padding:12px;
    border-radius:13px;
    background:rgba(4,9,15,.94);
}

.legend-title{
    font-size:12px;
    margin-bottom:7px;
}

.gradient{
    width:220px;
    height:10px;
    border-radius:10px;
    background:linear-gradient(
        90deg,
        #469cff,
        #2055e8,
        #6b2bd5,
        #bd25a9,
        #ed2450
    );
}

.legend-values{
    display:flex;
    justify-content:space-between;
    color:#8293a5;
    font-size:10px;
    margin-top:4px;
}

/* RADAR */

.radar-viewer{
    display:none;
    position:fixed;
    inset:0;
    z-index:100000;
    background:#02060b;
    overflow:hidden;

    /*
     * КРИТИЧЕСКИ ВАЖНО:
     * браузер не должен сам обрабатывать
     * pinch/scroll.
     */
    touch-action:none;
    overscroll-behavior:none;
}

.radar-viewer.open{
    display:block;
}

.radar-stage{
    position:absolute;

    /*
     * Центр сцены.
     */
    left:50%;
    top:50%;

    /*
     * Размер сцены больше экрана.
     * Поэтому GIF не обрезается при вращении.
     */
    width:100vw;
    height:100vh;

    transform-origin:0 0;

    will-change:transform;

    touch-action:none;

    display:flex;
    align-items:center;
    justify-content:center;
}

.radar-image{
    display:block;

    /*
     * Не ограничиваем GIF max-width.
     * Иначе браузер будет менять её размер
     * независимо от нашего transform.
     */
    width:auto;
    height:auto;

    max-width:none;
    max-height:none;

    image-rendering:pixelated;
    image-rendering:crisp-edges;

    user-select:none;
    -webkit-user-select:none;
    -webkit-user-drag:none;

    pointer-events:none;
}

/* RADAR HEADER */

.radar-header{
    position:absolute;
    z-index:200;

    left:9px;
    right:9px;
    top:9px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    pointer-events:none;
}

.radar-title{
    padding:9px 12px;
    border-radius:12px;
    background:rgba(3,8,14,.94);
    backdrop-filter:blur(12px);
    font-size:13px;
}

.radar-close{
    padding:10px 13px;
    border:0;
    border-radius:11px;
    background:rgba(3,8,14,.95);
    color:#fff;
    font-weight:650;
    pointer-events:auto;
}

/* CONTROLS */

.radar-controls{
    position:absolute;
    z-index:200;

    right:13px;
    top:50%;

    transform:translateY(-50%);

    display:flex;
    flex-direction:column;
    gap:8px;

    pointer-events:auto;
}

.radar-control{
    width:53px;
    height:53px;

    border:0;
    border-radius:15px;

    background:rgba(3,8,14,.95);
    color:#fff;

    font-size:23px;
    font-weight:600;

    box-shadow:0 4px 16px rgba(0,0,0,.4);

    -webkit-tap-highlight-color:transparent;
}

.radar-help{
    position:absolute;
    z-index:200;

    left:50%;
    bottom:10px;

    transform:translateX(-50%);

    padding:8px 12px;
    border-radius:10px;

    background:rgba(3,8,14,.82);
    color:#91a3b6;

    font-size:11px;

    white-space:nowrap;
    pointer-events:none;
}

@media(max-width:650px){

    .details{
        grid-template-columns:repeat(2,1fr);
    }

    .map-preview{
        height:340px;
    }

    .radar-control{
        width:51px;
        height:51px;
    }
}
</style>
</head>

<body>

<div class="app">

<header>
    <div class="logo">
        Метео<span>•</span>
    </div>

    <div id="locationStatus"
         class="location">
        Город не выбран
    </div>
</header>

<div class="search">

    <input
        id="cityInput"
        value="Уфа"
        placeholder="Введите город">

    <button onclick="searchCity()">⌕</button>

</div>

<div id="error"
     class="error"></div>

<div id="weather">
    <div style="
        padding:30px;
        text-align:center;
        color:#8496a9;
    ">
        Загрузка...
    </div>
</div>

<div class="section-title">
    Карта прогнозов
</div>

<div class="map-preview">

    <div id="previewMap"></div>

    <div class="preview-label">
        ICON • Осадки
    </div>

    <button
        class="open-map"
        onclick="openForecastMap()">
        Открыть карту
    </button>

</div>

</div>


<!-- FULL MAP -->

<div id="fullscreenMap"
     class="fullscreen-map">

    <div id="forecastMap"></div>

    <div class="map-top">

        <div class="map-layers">

            <button
                id="precipitationLayer"
                class="layer active"
                onclick="setLayer('precipitation')">
                🌧 Осадки
            </button>

            <button
                class="layer"
                onclick="openRadarViewer()">
                📡 Радарная-GIF
            </button>

        </div>

        <button
            class="close-map"
            onclick="closeForecastMap()">
            Закрыть карту
        </button>

    </div>

    <div class="legend">

        <div class="legend-title">
            Осадки, мм/ч
        </div>

        <div class="gradient"></div>

        <div class="legend-values">
            <span>0</span>
            <span>0.2</span>
            <span>1</span>
            <span>7</span>
            <span>15+</span>
        </div>

    </div>

</div>


<!-- RADAR GIF -->

<div id="radarViewer"
     class="radar-viewer">

    <div id="radarStage"
         class="radar-stage">

        <img
            id="radarImage"
            class="radar-image"
            draggable="false"
            alt="Radar">

    </div>

    <div class="radar-header">

        <div class="radar-title">
            📡 Meteoinfo • Radar
        </div>

        <button
            class="radar-close"
            onclick="closeRadarViewer()">
            Закрыть
        </button>

    </div>

    <div class="radar-controls">

        <button
            class="radar-control"
            onclick="radarZoom(1.25)">
            +
        </button>

        <button
            class="radar-control"
            onclick="radarZoom(.8)">
            −
        </button>

        <button
            class="radar-control"
            onclick="radarRotate(-15)">
            ↶
        </button>

        <button
            class="radar-control"
            onclick="radarRotate(15)">
            ↷
        </button>

        <button
            class="radar-control"
            onclick="resetRadar()">
            ⟳
        </button>

    </div>

    <div class="radar-help">
        Два пальца — масштаб и вращение • Один палец — перемещение
    </div>

</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* =====================================================
   MAP
===================================================== */

let latitude=54.7388;
let longitude=55.9721;

let previewMap;
let forecastMap;
let marker;

function createMaps(){

    previewMap=L.map(
        "previewMap",
        {
            zoomControl:false,
            attributionControl:false
        }
    ).setView(
        [latitude,longitude],
        5
    );

    L.tileLayer(
        "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
        {
            subdomains:"abcd",
            maxZoom:20
        }
    ).addTo(previewMap);


    forecastMap=L.map(
        "forecastMap",
        {
            zoomControl:true
        }
    ).setView(
        [latitude,longitude],
        5
    );

    L.tileLayer(
        "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
        {
            subdomains:"abcd",
            maxZoom:20,
            attribution:"© OpenStreetMap © CARTO"
        }
    ).addTo(forecastMap);

}

function updateMarker(){

    if(marker){
        forecastMap.removeLayer(marker);
    }

    marker=L.circleMarker(
        [latitude,longitude],
        {
            radius:6,
            color:"#fff",
            weight:2,
            fillColor:"#268cff",
            fillOpacity:1
        }
    ).addTo(forecastMap);
}

function openForecastMap(){

    document
    .getElementById("fullscreenMap")
    .classList.add("open");

    setTimeout(()=>{

        forecastMap.invalidateSize();

        forecastMap.setView(
            [latitude,longitude],
            6
        );

        updateMarker();

        loadPrecipitation();

    },100);
}

function closeForecastMap(){

    document
    .getElementById("fullscreenMap")
    .classList.remove("open");

}


/* =====================================================
   PRECIPITATION
===================================================== */

let precipLayer=null;

async function loadPrecipitation(){

    try{

        const url=
            "https://api.open-meteo.com/v1/dwd-icon"+
            "?latitude="+latitude+
            "&longitude="+longitude+
            "&hourly=precipitation"+
            "&forecast_days=1"+
            "&timezone=auto";

        /*
         * Точка прогноза.
         * Это намеренно не рисует мусорные точки
         * поверх всей карты.
         */

        await fetch(url);

    }catch(e){

        console.log(e);

    }

}

function setLayer(layer){

    if(layer==="precipitation"){

        document
        .getElementById("precipitationLayer")
        .classList.add("active");

        loadPrecipitation();

    }

}


/* =====================================================
   RADAR
===================================================== */

const radarViewer=
    document.getElementById("radarViewer");

const radarStage=
    document.getElementById("radarStage");

const radarImage=
    document.getElementById("radarImage");


/*
 * ВСЯ трансформация хранится
 * именно здесь.
 */

let radar={
    x:0,
    y:0,
    scale:1,
    rotation:0
};


/*
 * Активные пальцы.
 */

const pointers=new Map();


/*
 * Состояние текущего жеста.
 */

let gesture=null;


/*
 * Открытие.
 */

function openRadarViewer(){

    radarViewer.classList.add("open");

    loadRadar();

    /*
     * Здесь НЕТ resetRadar().
     *
     * Если пользователь снова открыл GIF,
     * последняя позиция сохраняется.
     */

    applyRadarTransform();
}


function closeRadarViewer(){

    radarViewer.classList.remove("open");

}


/*
 * GIF Meteoinfo.
 */

function loadRadar(){

    const oldX=radar.x;
    const oldY=radar.y;
    const oldScale=radar.scale;
    const oldRotation=radar.rotation;


    radarImage.onload=function(){

        radar.x=oldX;
        radar.y=oldY;
        radar.scale=oldScale;
        radar.rotation=oldRotation;

        applyRadarTransform();

    };


    radarImage.src=
        "https://meteoinfo.ru/hmc-output/rmap/phenomena.gif?"+
        Date.now();

}


/*
 * Обновление GIF каждые 4 минуты.
 */

setInterval(
    function(){

        if(
            radarViewer.classList.contains("open")
        ){

            loadRadar();

        }

    },
    240000
);


/* =====================================================
   TRANSFORM
===================================================== */

function applyRadarTransform(){

    /*
     * Вся трансформация делается
     * одним CSS transform.
     *
     * Никакого возврата к начальному
     * положению здесь нет.
     */

    radarStage.style.transform=
        "translate3d("+
        (
            -50+
            radar.x/(window.innerWidth)*100
        )+
        "%,"+
        (
            -50+
            radar.y/(window.innerHeight)*100
        )+
        "%,0)"+
        "rotate("+
        radar.rotation+
        "deg)"+
        "scale("+
        radar.scale+
        ")";

}


/* =====================================================
   BUTTON ZOOM
===================================================== */

function radarZoom(factor){

    radar.scale*=factor;

    radar.scale=Math.max(
        0.1,
        Math.min(
            20,
            radar.scale
        )
    );

    applyRadarTransform();

}


/* =====================================================
   BUTTON ROTATE
===================================================== */

function radarRotate(angle){

    radar.rotation+=angle;

    applyRadarTransform();

}


/* =====================================================
   RESET
===================================================== */

function resetRadar(){

    radar.x=0;
    radar.y=0;
    radar.scale=1;
    radar.rotation=0;

    applyRadarTransform();

}


/* =====================================================
   HELPERS
===================================================== */

function getDistance(a,b){

    const dx=b.x-a.x;
    const dy=b.y-a.y;

    return Math.sqrt(
        dx*dx+
        dy*dy
    );

}

function getAngle(a,b){

    return Math.atan2(
        b.y-a.y,
        b.x-a.x
    )*180/Math.PI;

}

function getCenter(a,b){

    return {
        x:(a.x+b.x)/2,
        y:(a.y+b.y)/2
    };

}


/* =====================================================
   POINTER DOWN
===================================================== */

radarViewer.addEventListener(
    "pointerdown",
    function(e){

        /*
         * Если нажали кнопку,
         * GIF-жест не начинаем.
         */

        if(
            e.target.closest(".radar-controls") ||
            e.target.closest(".radar-header")
        ){
            return;
        }

        e.preventDefault();

        /*
         * Захватываем pointer.
         */

        try{
            radarViewer.setPointerCapture(
                e.pointerId
            );
        }catch(_){}


        pointers.set(
            e.pointerId,
            {
                x:e.clientX,
                y:e.clientY
            }
        );


        /*
         * ОДИН ПАЛЕЦ
         */

        if(pointers.size===1){

            gesture={
                type:"pan",

                pointerId:e.pointerId,

                startX:e.clientX,
                startY:e.clientY,

                startRadarX:radar.x,
                startRadarY:radar.y
            };

        }


        /*
         * ДВА ПАЛЬЦА
         */

        if(pointers.size===2){

            const p=
                Array.from(
                    pointers.values()
                );

            const c=
                getCenter(
                    p[0],
                    p[1]
                );

            gesture={

                type:"transform",

                distance:getDistance(
                    p[0],
                    p[1]
                ),

                angle:getAngle(
                    p[0],
                    p[1]
                ),

                centerX:c.x,
                centerY:c.y,

                startScale:radar.scale,
                startRotation:radar.rotation,

                startRadarX:radar.x,
                startRadarY:radar.y
            };

        }

    },
    {
        passive:false
    }
);


/* =====================================================
   POINTER MOVE
===================================================== */

radarViewer.addEventListener(
    "pointermove",
    function(e){

        if(!pointers.has(e.pointerId))
            return;

        e.preventDefault();

        pointers.set(
            e.pointerId,
            {
                x:e.clientX,
                y:e.clientY
            }
        );


        /*
         * PAN
         */

        if(
            pointers.size===1 &&
            gesture &&
            gesture.type==="pan"
        ){

            /*
             * Ищем единственный
             * оставшийся палец.
             */

            const p=
                Array.from(
                    pointers.values()
                )[0];


            radar.x=
                gesture.startRadarX+
                (
                    p.x-
                    gesture.startX
                );


            radar.y=
                gesture.startRadarY+
                (
                    p.y-
                    gesture.startY
                );


            applyRadarTransform();

            return;

        }


        /*
         * PINCH + ROTATE
         */

        if(
            pointers.size===2 &&
            gesture &&
            gesture.type==="transform"
        ){

            const p=
                Array.from(
                    pointers.values()
                );


            const currentDistance=
                getDistance(
                    p[0],
                    p[1]
                );


            const currentAngle=
                getAngle(
                    p[0],
                    p[1]
                );


            const currentCenter=
                getCenter(
                    p[0],
                    p[1]
                );


            /*
             * SCALE
             */

            const ratio=
                currentDistance/
                gesture.distance;


            radar.scale=
                gesture.startScale*
                ratio;


            radar.scale=
                Math.max(
                    0.1,
                    Math.min(
                        20,
                        radar.scale
                    )
                );


            /*
             * ROTATE
             */

            let angleDelta=
                currentAngle-
                gesture.angle;


            /*
             * Исправляем переход
             * через -180/180.
             */

            if(angleDelta>180)
                angleDelta-=360;

            if(angleDelta<-180)
                angleDelta+=360;


            radar.rotation=
                gesture.startRotation+
                angleDelta;


            /*
             * PAN ЦЕНТРОМ ДВУХ ПАЛЬЦЕВ
             */

            radar.x=
                gesture.startRadarX+
                (
                    currentCenter.x-
                    gesture.centerX
                );


            radar.y=
                gesture.startRadarY+
                (
                    currentCenter.y-
                    gesture.centerY
                );


            applyRadarTransform();

        }

    },
    {
        passive:false
    }
);


/* =====================================================
   POINTER UP
===================================================== */

function finishPointer(e){

    /*
     * Удаляем только этот палец.
     */

    pointers.delete(
        e.pointerId
    );


    /*
     * КРИТИЧЕСКИЙ МОМЕНТ:
     *
     * Мы НЕ трогаем:
     *
     * radar.x
     * radar.y
     * radar.scale
     * radar.rotation
     *
     * Поэтому GIF остаётся ровно
     * там, где её оставили.
     */


    if(pointers.size===0){

        gesture=null;

        return;

    }


    /*
     * Если после двух пальцев
     * остался один:
     *
     * начинаем новый PAN
     * от уже существующей позиции.
     *
     * Поэтому скачка нет.
     */

    if(pointers.size===1){

        const p=
            Array.from(
                pointers.values()
            )[0];


        gesture={

            type:"pan",

            pointerId:null,

            startX:p.x,
            startY:p.y,

            startRadarX:radar.x,
            startRadarY:radar.y

        };

    }

}


radarViewer.addEventListener(
    "pointerup",
    finishPointer,
    {
        passive:false
    }
);


radarViewer.addEventListener(
    "pointercancel",
    finishPointer,
    {
        passive:false
    }
);

const weatherCodes={

    0:["☀️","Ясно"],
    1:["🌤️","Преимущественно ясно"],
    2:["⛅","Переменная облачность"],
    3:["☁️","Пасмурно"],

    45:["🌫️","Туман"],
    48:["🌫️","Изморозь"],

    51:["🌦️","Морось"],
    53:["🌦️","Морось"],
    55:["🌧️","Сильная морось"],

    61:["🌧️","Небольшой дождь"],
    63:["🌧️","Дождь"],
    65:["🌧️","Сильный дождь"],

    71:["🌨️","Небольшой снег"],
    73:["🌨️","Снег"],
    75:["❄️","Сильный снег"],

    80:["🌦️","Ливень"],
    81:["🌧️","Сильный ливень"],
    82:["⛈️","Очень сильный ливень"],

    85:["🌨️","Снегопад"],
    86:["❄️","Сильный снегопад"],

    95:["⛈️","Гроза"],
    96:["⛈️","Гроза с градом"],
    99:["⛈️","Сильная гроза с градом"]

};

function getWeather(code){

    return weatherCodes[code]
        || ["🌡️","Неизвестно"];

}

function getWindDirection(deg){

    const d=[
        "С","СВ","В","ЮВ",
        "Ю","ЮЗ","З","СЗ"
    ];

    return d[
        Math.round(deg/45)%8
    ];

}


/* =====================================================
   SEARCH
===================================================== */

async function searchCity(){

    const input=
        document.getElementById(
            "cityInput"
        );

    const city=
        input.value.trim();

    if(!city)
        return;


    document.getElementById(
        "error"
    ).style.display="none";


    document.getElementById(
        "weather"
    ).innerHTML=`

        <div style="
            padding:30px;
            text-align:center;
            color:#8496a9;
        ">
            Загрузка прогноза...
        </div>

    `;


    try{

        const response=
            await fetch(
                "https://geocoding-api.open-meteo.com/v1/search"+
                "?name="+
                encodeURIComponent(city)+
                "&count=1"+
                "&language=ru"+
                "&format=json"
            );


        const data=
            await response.json();


        if(
            !data.results ||
            !data.results.length
        ){

            throw new Error(
                "Город не найден"
            );

        }


        const place=
            data.results[0];


        latitude=
            place.latitude;

        longitude=
            place.longitude;


        document.getElementById(
            "locationStatus"
        ).textContent=
            place.name;


        previewMap.setView(
            [latitude,longitude],
            6
        );


        forecastMap.setView(
            [latitude,longitude],
            6
        );


        updateMarker();


        await loadWeather(
            place.name
        );

    }
    catch(error){

        document.getElementById(
            "locationStatus"
        ).textContent=
            "Город не выбран";


        document.getElementById(
            "error"
        ).textContent=
            "Не удалось найти город";


        document.getElementById(
            "error"
        ).style.display="block";

    }

}


/* =====================================================
   LOAD WEATHER
===================================================== */

async function loadWeather(city){

    const url=
        "https://api.open-meteo.com/v1/dwd-icon"+
        "?latitude="+latitude+
        "&longitude="+longitude+
        "&current="+
        "temperature_2m,"+
        "relative_humidity_2m,"+
        "apparent_temperature,"+
        "precipitation,"+
        "weather_code,"+
        "pressure_msl,"+
        "wind_speed_10m,"+
        "wind_direction_10m"+
        "&daily="+
        "weather_code,"+
        "temperature_2m_max,"+
        "temperature_2m_min,"+
        "precipitation_probability_max"+
        "&forecast_days=7"+
        "&timezone=auto";


    try{

        const response=
            await fetch(url);


        if(!response.ok)
            throw new Error();


        const data=
            await response.json();


        renderWeather(
            data,
            city
        );

    }
    catch(e){

        document.getElementById(
            "error"
        ).textContent=
            "Прогноз временно недоступен";

        document.getElementById(
            "error"
        ).style.display="block";

    }

}


/* =====================================================
   RENDER WEATHER
===================================================== */

function renderWeather(
    data,
    city
){

    const c=data.current;
    const d=data.daily;

    const w=
        getWeather(
            c.weather_code
        );


    let html=`

        <div class="current">

            <div class="current-top">

                <div>

                    <div class="city">
                        ${city}
                    </div>

                    <div class="date">
                        ${new Date().toLocaleDateString(
                            "ru-RU",
                            {
                                weekday:"long",
                                day:"numeric",
                                month:"long"
                            }
                        )}
                    </div>

                </div>

                <div class="weather-icon">
                    ${w[0]}
                </div>

            </div>


            <div class="temperature">
                ${Math.round(c.temperature_2m)}°
            </div>


            <div class="description">
                ${w[1]}
            </div>


            <div class="details">

                <div class="detail">
                    <div class="detail-title">
                        Ощущается
                    </div>
                    <div class="detail-value">
                        ${Math.round(c.apparent_temperature)}°
                    </div>
                </div>


                <div class="detail">
                    <div class="detail-title">
                        Влажность
                    </div>
                    <div class="detail-value">
                        ${c.relative_humidity_2m}%
                    </div>
                </div>


                <div class="detail">
                    <div class="detail-title">
                        Ветер
                    </div>
                    <div class="detail-value">
                        ${Math.round(c.wind_speed_10m)} км/ч
                    </div>
                </div>


                <div class="detail">
                    <div class="detail-title">
                        Направление
                    </div>
                    <div class="detail-value">
                        ${getWindDirection(
                            c.wind_direction_10m
                        )}
                        ${Math.round(
                            c.wind_direction_10m
                        )}°
                    </div>
                </div>


                <div class="detail">
                    <div class="detail-title">
                        Давление
                    </div>
                    <div class="detail-value">
                        ${Math.round(c.pressure_msl)} hPa
                    </div>
                </div>


                <div class="detail">
                    <div class="detail-title">
                        Осадки
                    </div>
                    <div class="detail-value">
                        ${c.precipitation} мм
                    </div>
                </div>


                <div class="detail">
                    <div class="detail-title">
                        Максимум
                    </div>
                    <div class="detail-value">
                        ${Math.round(
                            d.temperature_2m_max[0]
                        )}°
                    </div>
                </div>


                <div class="detail">
                    <div class="detail-title">
                        Осадки
                    </div>
                    <div class="detail-value">
                        ${d.precipitation_probability_max[0]}%
                    </div>
                </div>

            </div>

        </div>


        <div class="section-title">
            Прогноз на 7 дней
        </div>

        <div class="forecast">

    `;


    for(
        let i=0;
        i<7;
        i++
    ){

        const date=
            new Date(
                d.time[i]+"T12:00:00"
            );


        const dw=
            getWeather(
                d.weather_code[i]
            );


        const name=
            i===0
            ? "Сегодня"
            : date.toLocaleDateString(
                "ru-RU",
                {
                    weekday:"short"
                }
            );


        html+=`

            <div class="day">

                <div class="day-name">
                    ${name}
                </div>

                <div class="day-icon">
                    ${dw[0]}
                </div>

                <div class="day-temp">
                    ${Math.round(
                        d.temperature_2m_max[i]
                    )}°
                    /
                    ${Math.round(
                        d.temperature_2m_min[i]
                    )}°
                </div>

                <div class="day-rain">
                    💧
                    ${d.precipitation_probability_max[i]}%
                </div>

            </div>

        `;

    }


    html+=`

        </div>

    `;


    document.getElementById(
        "weather"
    ).innerHTML=html;

}
