<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Метео — прогноз погоды</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    min-height:100%;
    background:#060d16;
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

body{
    overflow-x:hidden;
}

.app{
    width:100%;
    max-width:1050px;
    margin:auto;
    padding:14px;
}

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:16px;
}

.logo{
    font-size:25px;
    font-weight:750;
}

.logo span{
    color:#268cff;
}

.location-status{
    color:#899bb0;
    font-size:13px;
}

.search{
    display:flex;
    gap:8px;
    margin-bottom:15px;
}

.search input{
    flex:1;
    height:50px;
    border:0;
    outline:0;
    border-radius:15px;
    padding:0 16px;
    background:#101c2a;
    color:#fff;
    font-size:16px;
}

.search input::placeholder{
    color:#6f8196;
}

.search button{
    width:52px;
    height:50px;
    border:0;
    border-radius:15px;
    background:#2689ff;
    color:#fff;
    font-size:23px;
}

.error{
    display:none;
    padding:13px;
    margin-bottom:14px;
    border-radius:14px;
    background:#35151d;
    color:#ff9daa;
}

.current{
    background:linear-gradient(145deg,#112d4c,#091521);
    border:1px solid rgba(255,255,255,.06);
    border-radius:24px;
    padding:22px;
}

.current-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
}

.city{
    font-size:26px;
    font-weight:700;
}

.date{
    margin-top:5px;
    color:#899bb0;
    font-size:14px;
    text-transform:capitalize;
}

.weather-icon{
    font-size:53px;
}

.temperature{
    margin-top:7px;
    font-size:70px;
    line-height:1;
    font-weight:700;
}

.description{
    margin-top:8px;
    color:#c3cedb;
    font-size:18px;
}

.details{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:9px;
    margin-top:24px;
}

.detail{
    background:rgba(255,255,255,.05);
    border-radius:14px;
    padding:13px;
}

.detail-title{
    color:#7f91a7;
    font-size:12px;
    margin-bottom:6px;
}

.detail-value{
    font-size:15px;
    font-weight:650;
}

.section-title{
    font-size:20px;
    font-weight:700;
    margin:23px 0 11px;
}

.forecast{
    display:flex;
    gap:9px;
    overflow-x:auto;
}

.forecast::-webkit-scrollbar{
    display:none;
}

.day{
    min-width:112px;
    background:#101c2a;
    border-radius:17px;
    padding:14px;
    text-align:center;
}

.day-name{
    color:#9aaabd;
    font-size:13px;
}

.day-icon{
    font-size:32px;
    margin:10px 0;
}

.day-temp{
    font-size:17px;
    font-weight:650;
}

.day-rain{
    margin-top:7px;
    color:#62aaff;
    font-size:12px;
}

.map-preview{
    position:relative;
    height:250px;
    width:100%;
    overflow:hidden;
    border-radius:21px;
    border:1px solid rgba(255,255,255,.08);
    background:#070e17;
}

#previewMap{
    width:100%;
    height:100%;
}

.preview-label{
    position:absolute;
    left:12px;
    top:12px;
    z-index:1000;
    padding:7px 10px;
    border-radius:9px;
    background:rgba(5,12,21,.88);
    backdrop-filter:blur(10px);
    color:#cbd6e2;
    font-size:12px;
}

.open-map{
    position:absolute;
    right:10px;
    bottom:10px;
    z-index:1000;
    border:0;
    border-radius:10px;
    padding:9px 13px;
    background:rgba(5,12,21,.94);
    color:#fff;
    font-size:13px;
    font-weight:650;
}

.fullscreen-map{
    display:none;
    position:fixed;
    inset:0;
    z-index:99999;
    width:100vw;
    height:100vh;
    background:#060c14;
}

.fullscreen-map.open{
    display:block;
}

#forecastMap{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
}

.map-top{
    position:absolute;
    z-index:10000;
    top:12px;
    left:12px;
    right:12px;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
    pointer-events:none;
}

.map-layers{
    display:flex;
    gap:5px;
    padding:6px;
    background:rgba(5,12,21,.92);
    backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.1);
    border-radius:13px;
    pointer-events:auto;
}

.layer{
    border:0;
    border-radius:9px;
    padding:9px 11px;
    background:#111f30;
    color:#aebdce;
    font-size:12px;
    white-space:nowrap;
}

.layer.active{
    background:#2689ff;
    color:#fff;
}

.close-map{
    border:0;
    border-radius:11px;
    padding:10px 14px;
    background:rgba(5,12,21,.94);
    color:#fff;
    font-size:13px;
    font-weight:650;
    pointer-events:auto;
}

.map-info{
    position:absolute;
    z-index:10000;
    left:12px;
    bottom:12px;
    min-width:180px;
    padding:11px 13px;
    background:rgba(5,12,21,.92);
    backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.1);
    border-radius:13px;
    pointer-events:none;
}

.map-info-title{
    font-size:12px;
    color:#9aabba;
    margin-bottom:6px;
}

.map-gradient{
    width:180px;
    height:9px;
    border-radius:10px;
}

.map-values{
    width:180px;
    display:flex;
    justify-content:space-between;
    margin-top:4px;
    color:#8495a9;
    font-size:10px;
}

.map-loading{
    position:absolute;
    z-index:10001;
    top:75px;
    left:50%;
    transform:translateX(-50%);
    padding:9px 13px;
    border-radius:11px;
    background:rgba(5,12,21,.92);
    font-size:12px;
    color:#c7d2df;
    display:none;
}

.loading{
    text-align:center;
    padding:40px 0;
    color:#899bb0;
}

.leaflet-container{
    background:#060d15;
}

.leaflet-control-zoom a{
    background:#101c2b!important;
    color:#fff!important;
    border-color:#293b50!important;
}

.leaflet-control-attribution{
    background:rgba(5,12,21,.8)!important;
    color:#718196!important;
}

.leaflet-control-attribution a{
    color:#71aaff!important;
}

@media(max-width:650px){

    .app{
        padding:12px;
    }

    .details{
        grid-template-columns:repeat(2,1fr);
    }

    .temperature{
        font-size:61px;
    }

    .map-preview{
        height:220px;
    }

    .map-top{
        left:8px;
        right:8px;
        top:8px;
    }

    .map-layers{
        max-width:calc(100% - 105px);
        overflow-x:auto;
    }

    .layer{
        padding:8px 9px;
    }

    .close-map{
        padding:9px 10px;
    }

    .map-info{
        left:8px;
        bottom:8px;
    }
}
</style>
</head>

<body>

<div class="app">

<header>

    <div class="logo">
        Метео<span>•</span>
    </div>

    <div
        class="location-status"
        id="locationStatus"
    >
        Город не выбран
    </div>

</header>


<div class="search">

    <input
        id="cityInput"
        value="Уфа"
        placeholder="Введите город..."
    >

    <button onclick="searchCity()">
        ⌕
    </button>

</div>


<div
    class="error"
    id="error"
></div>


<div id="weather">

    <div class="loading">
        Загрузка прогноза...
    </div>

</div>


<div class="section-title">
    Карта прогнозов
</div>


<div class="map-preview">

    <div id="previewMap"></div>

    <div class="preview-label">
        Реальный DWD ICON Global
    </div>

    <button
        class="open-map"
        onclick="openForecastMap()"
    >
        Открыть карту
    </button>

</div>

</div>


<div
    class="fullscreen-map"
    id="fullscreenMap"
>

    <div id="forecastMap"></div>


    <div class="map-top">

        <div class="map-layers">

            <button
                class="layer active"
                id="temperatureLayer"
                onclick="setLayer('temperature')"
            >
                🌡 Температура
            </button>

            <button
                class="layer"
                id="precipitationLayer"
                onclick="setLayer('precipitation')"
            >
                🌧 Осадки
            </button>

            <button
                class="layer"
                id="windLayer"
                onclick="setLayer('wind')"
            >
                💨 Ветер
            </button>

        </div>


        <button
            class="close-map"
            onclick="closeForecastMap()"
        >
            Закрыть карту
        </button>

    </div>


    <div
        class="map-loading"
        id="mapLoading"
    >
        Загрузка ICON...
    </div>


    <div class="map-info">

        <div
            class="map-info-title"
            id="mapInfoTitle"
        >
            Температура, °C
        </div>

        <div
            class="map-gradient"
            id="mapGradient"
        ></div>

        <div
            class="map-values"
            id="mapValues"
        >
            <span>−30°</span>
            <span>0°</span>
            <span>+30°</span>
        </div>

    </div>

</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* =========================================================
   WEATHER CODES
========================================================= */

const weatherCodes={

0:["☀️","Ясно"],
1:["🌤️","Преимущественно ясно"],
2:["⛅","Переменная облачность"],
3:["☁️","Пасмурно"],

45:["🌫️","Туман"],
48:["🌫️","Изморозь"],

51:["🌦️","Морось"],
53:["🌦️","Морось"],
55:["🌧️","Сильная морось"],

56:["🌧️","Ледяная морось"],
57:["🌧️","Сильная ледяная морось"],

61:["🌧️","Небольшой дождь"],
63:["🌧️","Дождь"],
65:["🌧️","Сильный дождь"],

66:["🌧️","Ледяной дождь"],
67:["🌧️","Сильный ледяной дождь"],

71:["🌨️","Небольшой снег"],
73:["🌨️","Снег"],
75:["❄️","Сильный снег"],

77:["🌨️","Снежные зерна"],

80:["🌦️","Ливень"],
81:["🌧️","Сильный ливень"],
82:["⛈️","Очень сильный ливень"],

85:["🌨️","Снегопад"],
86:["❄️","Сильный снегопад"],

95:["⛈️","Гроза"],
96:["⛈️","Гроза с градом"],
99:["⛈️","Сильная гроза с градом"]

};


function getWeather(code){

return weatherCodes[code] || ["🌡️","Неизвестно"];

}


/* =========================================================
   VARIABLES
========================================================= */

let latitude=54.7388;
let longitude=55.9721;

let previewMap;
let forecastMap;
let marker;

let selectedLayer="temperature";

let gridData=null;
let gridMeta=null;

let forecastCanvas=null;

let renderToken=0;

const gridRows=17;
const gridCols=17;


/* =========================================================
   MAPS
========================================================= */

function createMaps(){

previewMap=L.map(
"previewMap",
{
zoomControl:false,
attributionControl:false,
scrollWheelZoom:false
}
).setView(
[latitude,longitude],
5
);


L.tileLayer(
"https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
{
maxZoom:20,
subdomains:"abcd",
attribution:"© OpenStreetMap © CARTO"
}
).addTo(previewMap);


forecastMap=L.map(
"forecastMap",
{
zoomControl:true,
attributionControl:true
}
).setView(
[latitude,longitude],
5
);


L.tileLayer(
"https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
{
maxZoom:20,
subdomains:"abcd",
attribution:"© OpenStreetMap © CARTO"
}
).addTo(forecastMap);


forecastMap.on(
"moveend",
()=>{

if(
document
.getElementById("fullscreenMap")
.classList
.contains("open")
){

loadForecastGrid();

}

}
);

}


/* =========================================================
   MARKER
========================================================= */

function updateMarker(){

if(marker){

forecastMap.removeLayer(marker);

}

marker=
L.circleMarker(
[latitude,longitude],
{
radius:6,
color:"#fff",
weight:2,
fillColor:"#268cff",
fillOpacity:1
}
).addTo(forecastMap);

}


/* =========================================================
   OPEN MAP
========================================================= */

function openForecastMap(){

document
.getElementById("fullscreenMap")
.classList
.add("open");


setTimeout(()=>{

forecastMap.invalidateSize();

forecastMap.setView(
[latitude,longitude],
6
);

updateMarker();

loadForecastGrid();

},100);

}


/* =========================================================
   CLOSE MAP
========================================================= */

function closeForecastMap(){

document
.getElementById("fullscreenMap")
.classList
.remove("open");


if(forecastCanvas){

forecastCanvas.remove();

forecastCanvas=null;

}

}


/* =========================================================
   LOADING
========================================================= */

function showMapLoading(show){

document
.getElementById("mapLoading")
.style.display=
show
?"block"
:"none";

}


/* =========================================================
   GET VALUE
========================================================= */

function getGridValue(item){

if(!item)
return null;


if(selectedLayer==="temperature")
return item.temperature;


if(selectedLayer==="precipitation")
return item.precipitation;


return item.wind;

}


/* =========================================================
   COLORS
========================================================= */

function colorFor(
value,
layer
){

if(
value===null ||
!isFinite(value)
){

return [
0,0,0,0
];

}


/* TEMPERATURE */

if(layer==="temperature"){

if(value<=-30)
return [35,65,180,205];

if(value<=-20)
return [45,105,210,205];

if(value<=-10)
return [70,160,235,205];

if(value<=0)
return [95,205,230,205];

if(value<=10)
return [135,220,170,205];

if(value<=20)
return [245,225,75,205];

if(value<=30)
return [245,145,45,210];

if(value<=40)
return [225,55,35,215];

return [150,20,25,220];

}


/* PRECIPITATION */

if(layer==="precipitation"){

if(value<=0.05)
return [0,0,0,0];

if(value<=0.2)
return [70,170,255,80];

if(value<=1)
return [40,140,255,125];

if(value<=3)
return [25,90,235,165];

if(value<=7)
return [95,45,220,185];

if(value<=15)
return [185,35,180,205];

return [235,30,80,220];

}


/* WIND */

if(value<=5)
return [60,180,150,90];

if(value<=10)
return [65,210,115,125];

if(value<=20)
return [150,225,60,160];

if(value<=30)
return [250,215,50,180];

if(value<=40)
return [245,125,45,205];

return [220,40,40,220];

}


/* =========================================================
   DRAW FORECAST FIELD
========================================================= */

function drawForecastCanvas(){

if(
!gridData ||
!gridMeta ||
!forecastMap
){

return;

}


if(forecastCanvas){

forecastCanvas.remove();

}


const canvas=
document.createElement("canvas");


canvas.width=340;
canvas.height=340;


const bounds=
L.latLngBounds(
[
gridMeta.latMin,
gridMeta.lonMin
],
[
gridMeta.latMax,
gridMeta.lonMax
]
);


const overlay=
L.DomUtil.create(
"div",
"icon-field-overlay",
forecastMap
.getPanes()
.overlayPane
);


overlay.style.position="absolute";
overlay.style.pointerEvents="none";
overlay.style.zIndex="450";


overlay.appendChild(canvas);


forecastCanvas=overlay;


function render(){

const nw=
forecastMap.latLngToLayerPoint(
bounds.getNorthWest()
);


const se=
forecastMap.latLngToLayerPoint(
bounds.getSouthEast()
);


const width=
Math.max(
1,
se.x-nw.x
);


const height=
Math.max(
1,
se.y-nw.y
);


overlay.style.left=
nw.x+"px";

overlay.style.top=
nw.y+"px";

overlay.style.width=
width+"px";

overlay.style.height=
height+"px";


canvas.style.width=
width+"px";

canvas.style.height=
height+"px";


const ctx=
canvas.getContext("2d");


const w=
canvas.width;

const h=
canvas.height;


const image=
ctx.createImageData(
w,
h
);


const pixels=
image.data;


const values=
gridData.map(
getGridValue
);


function valueAt(
gx,
gy
){

gx=
Math.max(
0,
Math.min(
gridCols-1,
gx
)
);


gy=
Math.max(
0,
Math.min(
gridRows-1,
gy
)
);


const x0=
Math.floor(gx);

const y0=
Math.floor(gy);


const x1=
Math.min(
x0+1,
gridCols-1
);

const y1=
Math.min(
y0+1,
gridRows-1
);


const fx=
gx-x0;

const fy=
gy-y0;


const a=
values[
y0*gridCols+x0
];

const b=
values[
y0*gridCols+x1
];

const c=
values[
y1*gridCols+x0
];

const d=
values[
y1*gridCols+x1
];


if(
[a,b,c,d]
.some(
v=>
v===null ||
!isFinite(v)
)
){

return null;

}


const top=
a+
(b-a)*fx;


const bottom=
c+
(d-c)*fx;


return top+
(bottom-top)*fy;

}


for(
let y=0;
y<h;
y++
){

for(
let x=0;
x<w;
x++
){

const gx=
x/(w-1)*
(gridCols-1);


const gy=
y/(h-1)*
(gridRows-1);


const value=
valueAt(
gx,
gy
);


const color=
colorFor(
value,
selectedLayer
);


const i=
(y*w+x)*4;


pixels[i]=color[0];

pixels[i+1]=color[1];

pixels[i+2]=color[2];

pixels[i+3]=color[3];

}

}


ctx.putImageData(
image,
0,
0
);

}


function update(){

render();

}


forecastMap.on(
"zoom move resize",
update
);


render();

}


/* =========================================================
   LOAD REAL ICON DATA
========================================================= */

async function loadForecastGrid(){

const token=
++renderToken;


showMapLoading(true);


const center=
forecastMap.getCenter();


const zoom=
forecastMap.getZoom();


let latStep;
let lonStep;


if(zoom<=4){

latStep=3;
lonStep=4.5;

}
else if(zoom<=5){

latStep=2;
lonStep=3;

}
else if(zoom<=6){

latStep=1.2;
lonStep=1.8;

}
else{

latStep=.65;
lonStep=.95;

}


const latMin=
Math.max(
-80,
center.lat-
((gridRows-1)/2)*latStep
);


const latMax=
Math.min(
80,
center.lat+
((gridRows-1)/2)*latStep
);


const lonMin=
center.lng-
((gridCols-1)/2)*lonStep;


const lonMax=
center.lng+
((gridCols-1)/2)*lonStep;


const lats=[];
const lons=[];


for(
let y=0;
y<gridRows;
y++
){

const lat=
latMin+
(latMax-latMin)*
y/(gridRows-1);


for(
let x=0;
x<gridCols;
x++
){

const lon=
lonMin+
(lonMax-lonMin)*
x/(gridCols-1);


lats.push(
lat.toFixed(3)
);

lons.push(
lon.toFixed(3)
);

}

}


const url=
"https://api.open-meteo.com/v1/dwd-icon"+
"?latitude="+
lats.join(",")+
"&longitude="+
lons.join(",")+
"&hourly=temperature_2m,precipitation,wind_speed_10m"+
"&forecast_hours=1"+
"&timezone=GMT";


try{

const response=
await fetch(url);


if(!response.ok){

throw new Error(
"ICON request failed"
);

}


const data=
await response.json();


if(token!==renderToken)
return;


const locations=
Array.isArray(data)
?data
:[data];


gridData=
locations.map(
item=>({

temperature:
item.hourly
?.temperature_2m
?.[0]??null,

precipitation:
item.hourly
?.precipitation
?.[0]??null,

wind:
item.hourly
?.wind_speed_10m
?.[0]??null

})
);


gridMeta={

latMin,
latMax,
lonMin,
lonMax

};


drawForecastCanvas();

}
catch(error){

console.error(
"ICON:",
error
);

}
finally{

if(
token===renderToken
){

showMapLoading(false);

}

}

}


/* =========================================================
   LAYER SWITCH
========================================================= */

layer;

.querySelectorAll(".layer")
.forEach(
button=>
button.classList
.remove("active")
);


if(layer==="temperature"){

document
.getElementById(
"temperatureLayer"
)
.classList
.add("active");

.getElementById(
"mapInfoTitle"
)
.textContent=
"Температура, °C";

.getElementById(

)

"mapValues"

.getElementById(
"precipitationLayer"

)

.getElementById(

.getElementById(
"mapValues"
)

)

"mapInfoTitle"
)
.textContent=
"Ветер, км/ч";

.getElementById(
"mapGradient"
)
.style.background=

.getElementById(
"mapValues"

.innerHTML=

/* =========================================================
   CITY SEARCH
========================================================= */

async function searchCity(){

const city=
document
.getElementById(
"cityInput"
)
.value
.trim();


if(!city)
return;


showLoading();


try{

const response=
await fetch(
"https://geocoding-api.open-meteo.com/v1/search"+
"?name="+
encodeURIComponent(city)+
"&count=1"+
"&language=ru"+
"&format=json"
);


const data=
await response.json();


if(
!data.results ||
!data.results.length
){

throw new Error(
"not-found"
);

}


const place=
data.results[0];


latitude=
place.latitude;

longitude=
place.longitude;


previewMap.setView(
[latitude,longitude],
6
);


forecastMap.setView(
[latitude,longitude],
6
);


updateMarker();


await loadWeather(
latitude,
longitude,
place.name
);

}
catch(error){

document
.getElementById(
"locationStatus"
)
.textContent=
"Город не выбран";


showError(
"Город не выбран"
);

}

}


/* =========================================================
   WEATHER API
========================================================= */

async function loadWeather(
lat,
lon,
city
){

const url=
"https://api.open-meteo.com/v1/dwd-icon"+
"?latitude="+
lat+
"&longitude="+
lon+
"&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,pressure_msl,wind_speed_10m"+
"&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max"+
"&timezone=auto";


try{

const response=
await fetch(url);


if(!response.ok){

throw new Error();

}


const data=
await response.json();


document
.getElementById(
"locationStatus"
)
.textContent=
city;


renderWeather(
data,
city
);

}
catch(error){

document
.getElementById(
"locationStatus"
)
.textContent=
"Город не выбран";


showError(
"Город не выбран"
);

}

}


/* =========================================================
   WEATHER UI
========================================================= */

function renderWeather(
data,
city
){

const c=
data.current;

const d=
data.daily;

const weather=
getWeather(
c.weather_code
);


let html=`

<div class="current">

<div class="current-top">

<div>

<div class="city">
${city}
</div>

<div class="date">
${formatDate(new Date())}
</div>

</div>

<div class="weather-icon">
${weather[0]}
</div>

</div>


<div class="temperature">
${Math.round(c.temperature_2m)}°
</div>


<div class="description">
${weather[1]}
</div>


<div class="details">

<div class="detail">
<div class="detail-title">Ощущается</div>
<div class="detail-value">
${Math.round(c.apparent_temperature)}°
</div>
</div>


<div class="detail">
<div class="detail-title">Влажность</div>
<div class="detail-value">
${c.relative_humidity_2m}%
</div>
</div>


<div class="detail">
<div class="detail-title">Ветер</div>
<div class="detail-value">
${Math.round(c.wind_speed_10m)} км/ч
</div>
</div>


<div class="detail">
<div class="detail-title">Давление</div>
<div class="detail-value">
${Math.round(c.pressure_msl)} hPa
</div>
</div>


<div class="detail">
<div class="detail-title">Осадки</div>
<div class="detail-value">
${c.precipitation} мм
</div>
</div>


<div class="detail">
<div class="detail-title">Максимум</div>
<div class="detail-value">
${Math.round(d.temperature_2m_max[0])}°
</div>
</div>


<div class="detail">
<div class="detail-title">Минимум</div>
<div class="detail-value">
${Math.round(d.temperature_2m_min[0])}°
</div>
</div>


<div class="detail">
<div class="detail-title">Вероятность осадков</div>
<div class="detail-value">
${d.precipitation_probability_max[0]}%
</div>
</div>

</div>

</div>


<div class="section-title">
Прогноз на 7 дней
</div>


<div class="forecast">

`;


for(
let i=0;
i<7;
i++
){

const date=
new Date(
d.time[i]+"T12:00:00"
);


const dayWeather=
getWeather(
d.weather_code[i]
);


const dayName=
i===0
?"Сегодня"
:
date.toLocaleDateString(
"ru-RU",
{
weekday:"short"
}
);


html+=`

<div class="day">

<div class="day-name">
${dayName}
</div>

<div class="day-icon">
${dayWeather[0]}
</div>

<div class="day-temp">
${Math.round(
d.temperature_2m_max[i]
)}°
/
${Math.round(
d.temperature_2m_min[i]
)}°
</div>

<div class="day-rain">
💧
${d.precipitation_probability_max[i]}%
</div>

</div>

`;

}


html+=`

</div>

`;


document
.getElementById(
"weather"
)
.innerHTML=
html;

}


/* =========================================================
   HELPERS
========================================================= */

function formatDate(date){

return date.toLocaleDateString(
"ru-RU",
{
weekday:"long",
day:"numeric",
month:"long"
}
);

}


function showLoading(){

document
.getElementById(
"error"
)
.style.display=
"none";


document
.getElementById(
"weather"
)
.innerHTML=
`
<div class="loading">
Загрузка прогноза...
</div>
`;

}


function showError(message){

const error=
document
.getElementById(
"error"
);


error.textContent=
message;


error.style.display=
"block";


document
.getElementById(
"weather"
)
.innerHTML=
"";

}


/* =========================================================
   ENTER
========================================================= */

document
.getElementById(
"cityInput"
)
.addEventListener(
"keydown",
event=>{

if(
event.key==="Enter"
){

searchCity();

}

}
);


/* =========================================================
   START
========================================================= */

createMaps();

searchCity();

</script>

</body>
</html>
