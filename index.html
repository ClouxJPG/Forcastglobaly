<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Метео — прогноз погоды</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    min-height:100%;
    background:#07101b;
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

body{
    overflow-x:hidden;
}

.app{
    width:100%;
    max-width:1000px;
    margin:auto;
    padding:15px;
}

/* HEADER */

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:17px;
}

.logo{
    font-size:25px;
    font-weight:750;
}

.logo span{
    color:#268cff;
}

.location-status{
    color:#8fa0b5;
    font-size:13px;
}

/* SEARCH */

.search{
    display:flex;
    gap:9px;
    margin-bottom:15px;
}

.search input{
    flex:1;
    height:50px;
    border:0;
    outline:0;
    border-radius:15px;
    background:#101d2c;
    color:#fff;
    padding:0 16px;
    font-size:16px;
}

.search input::placeholder{
    color:#718095;
}

.search button{
    width:52px;
    height:50px;
    border:0;
    border-radius:15px;
    background:#2689ff;
    color:white;
    font-size:23px;
}

/* ERROR */

.error{
    display:none;
    background:#35151d;
    color:#ff9ca8;
    padding:14px;
    border-radius:14px;
    margin-bottom:15px;
}

/* CURRENT */

.current{
    background:linear-gradient(145deg,#112d4c,#091522);
    border:1px solid rgba(255,255,255,.06);
    border-radius:24px;
    padding:22px;
}

.current-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
}

.city{
    font-size:26px;
    font-weight:700;
}

.date{
    margin-top:5px;
    color:#8fa0b5;
    font-size:14px;
    text-transform:capitalize;
}

.weather-icon{
    font-size:54px;
}

.temperature{
    margin-top:7px;
    font-size:70px;
    line-height:1;
    font-weight:700;
}

.description{
    margin-top:8px;
    font-size:18px;
    color:#c4cfdd;
}

/* DETAILS */

.details{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:9px;
    margin-top:25px;
}

.detail{
    background:rgba(255,255,255,.05);
    border-radius:14px;
    padding:13px;
}

.detail-title{
    color:#7f91a8;
    font-size:12px;
    margin-bottom:6px;
}

.detail-value{
    font-size:15px;
    font-weight:650;
}

/* SECTION */

.section-title{
    font-size:20px;
    font-weight:700;
    margin:23px 0 11px;
}

/* DAYS */

.forecast{
    display:flex;
    gap:9px;
    overflow-x:auto;
    padding-bottom:2px;
}

.forecast::-webkit-scrollbar{
    display:none;
}

.day{
    min-width:112px;
    background:#101d2c;
    border-radius:17px;
    padding:14px;
    text-align:center;
}

.day-name{
    color:#9aaabd;
    font-size:13px;
}

.day-icon{
    font-size:32px;
    margin:11px 0;
}

.day-temp{
    font-size:17px;
    font-weight:650;
}

.day-rain{
    color:#61aaff;
    font-size:12px;
    margin-top:7px;
}

/* MAP PREVIEW */

.map-preview{
    position:relative;
    width:100%;
    height:180px;
    border-radius:20px;
    overflow:hidden;
    background:#080e16;
    border:1px solid rgba(255,255,255,.08);
}

#previewMap{
    width:100%;
    height:100%;
}

/* OPEN BUTTON */

.open-map-button{
    position:absolute;
    z-index:1000;
    right:10px;
    bottom:10px;

    border:0;
    border-radius:10px;

    padding:9px 13px;

    background:rgba(7,15,27,.94);
    color:white;

    font-size:13px;
    font-weight:600;

    box-shadow:0 4px 15px rgba(0,0,0,.35);
}

/* FULL MAP */

.map-fullscreen{
    display:none;

    position:fixed;
    z-index:99999;

    inset:0;

    width:100vw;
    height:100vh;

    background:#060c14;
}

.map-fullscreen.open{
    display:block;
}

#fullMap{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;
}

/* CLOSE */

.close-map-button{
    position:absolute;
    z-index:10000;

    top:15px;
    right:15px;

    border:0;
    border-radius:12px;

    background:rgba(7,15,27,.94);
    color:white;

    padding:11px 15px;

    font-size:14px;
    font-weight:650;

    box-shadow:0 4px 20px rgba(0,0,0,.4);
}

/* MAP LAYERS */

.layer-panel{
    position:absolute;
    z-index:10000;

    top:15px;
    left:15px;

    display:flex;
    gap:6px;

    padding:6px;

    background:rgba(7,15,27,.9);

    border:1px solid rgba(255,255,255,.1);

    border-radius:13px;

    backdrop-filter:blur(12px);
}

.layer-button{
    border:0;

    background:#142236;
    color:#aebdce;

    padding:9px 11px;

    border-radius:9px;

    font-size:12px;
    white-space:nowrap;
}

.layer-button.active{
    background:#2689ff;
    color:white;
}

/* LEAFLET */

.leaflet-container{
    background:#070d15;
}

.leaflet-control-zoom a{
    background:#101c2b!important;
    color:white!important;
    border-color:#26384d!important;
}

.leaflet-control-attribution{
    background:rgba(5,11,20,.8)!important;
    color:#718198!important;
}

.leaflet-control-attribution a{
    color:#70aaff!important;
}

/* LOADING */

.loading{
    text-align:center;
    color:#8c9caf;
    padding:40px 0;
}

/* MOBILE */

@media(max-width:650px){

    .app{
        padding:12px;
    }

    .details{
        grid-template-columns:repeat(2,1fr);
    }

    .temperature{
        font-size:62px;
    }

    .current{
        padding:19px;
    }

    .map-preview{
        height:170px;
    }

    .layer-panel{
        top:10px;
        left:10px;
        right:10px;
        overflow-x:auto;
    }

    .close-map-button{
        top:10px;
        right:10px;
    }
}
</style>
</head>

<body>

<div class="app">

<header>
    <div class="logo">
        Метео<span>•</span>
    </div>

    <div
        class="location-status"
        id="locationStatus"
    >
        Погода
    </div>
</header>


<div class="search">

    <input
        id="cityInput"
        type="text"
        value="Уфа"
        placeholder="Введите город..."
    >

    <button onclick="searchCity()">
        ⌕
    </button>

</div>


<div
    class="error"
    id="error"
></div>


<div id="weather">

    <div class="loading">
        Загрузка погоды...
    </div>

</div>


<!-- КАРТА-ПРЕВЬЮ -->

<div class="section-title">
    Карта прогнозов
</div>

<div class="map-preview">

    <div id="previewMap"></div>

    <button
        class="open-map-button"
        onclick="openMap()"
    >
        Открыть карту
    </button>

</div>

</div>


<!-- ПОЛНОЭКРАННАЯ КАРТА -->

<div
    class="map-fullscreen"
    id="mapFullscreen"
>

    <div id="fullMap"></div>


    <div class="layer-panel">

        <button
            class="layer-button active"
            id="temperatureButton"
            onclick="changeLayer('temperature')"
        >
            🌡 Температура
        </button>

        <button
            class="layer-button"
            id="rainButton"
            onclick="changeLayer('rain')"
        >
            🌧 Осадки
        </button>

        <button
            class="layer-button"
            id="windButton"
            onclick="changeLayer('wind')"
        >
            💨 Ветер
        </button>

    </div>


    <button
        class="close-map-button"
        onclick="closeMap()"
    >
        Закрыть карту
    </button>

</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* =========================================================
   WEATHER
========================================================= */

const weatherCodes={

    0:["☀️","Ясно"],
    1:["🌤️","Преимущественно ясно"],
    2:["⛅","Переменная облачность"],
    3:["☁️","Пасмурно"],

    45:["🌫️","Туман"],
    48:["🌫️","Изморозь"],

    51:["🌦️","Морось"],
    53:["🌦️","Морось"],
    55:["🌧️","Сильная морось"],

    56:["🌧️","Ледяная морось"],
    57:["🌧️","Сильная ледяная морось"],

    61:["🌧️","Небольшой дождь"],
    63:["🌧️","Дождь"],
    65:["🌧️","Сильный дождь"],

    66:["🌧️","Ледяной дождь"],
    67:["🌧️","Сильный ледяной дождь"],

    71:["🌨️","Небольшой снег"],
    73:["🌨️","Снег"],
    75:["❄️","Сильный снег"],

    77:["🌨️","Снежные зерна"],

    80:["🌦️","Ливень"],
    81:["🌧️","Сильный ливень"],
    82:["⛈️","Очень сильный ливень"],

    85:["🌨️","Снегопад"],
    86:["❄️","Сильный снегопад"],

    95:["⛈️","Гроза"],
    96:["⛈️","Гроза с градом"],
    99:["⛈️","Сильная гроза с градом"]

};


function getWeather(code){

    return weatherCodes[code] || ["🌡️","Неизвестно"];

}


/* =========================================================
   VARIABLES
========================================================= */

let latitude=54.7388;
let longitude=55.9721;

let previewMap;
let fullMap;

let selectedLayer="temperature";


/* =========================================================
   DARK MAP
========================================================= */

function createMaps(){

    previewMap=L.map(
        "previewMap",
        {
            zoomControl:false,
            attributionControl:false
        }
    ).setView(
        [latitude,longitude],
        5
    );


    L.tileLayer(
        "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
        {
            maxZoom:20,
            subdomains:"abcd",
            attribution:"© OpenStreetMap © CARTO"
        }
    ).addTo(previewMap);


    fullMap=L.map(
        "fullMap",
        {
            zoomControl:true,
            attributionControl:true
        }
    ).setView(
        [latitude,longitude],
        5
    );


    L.tileLayer(
        "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
        {
            maxZoom:20,
            subdomains:"abcd",
            attribution:"© OpenStreetMap © CARTO"
        }
    ).addTo(fullMap);


    L.marker(
        [latitude,longitude]
    )
    .addTo(fullMap)
    .bindPopup("Текущая точка");


    L.marker(
        [latitude,longitude]
    )
    .addTo(previewMap);


}


/* =========================================================
   OPEN / CLOSE MAP
========================================================= */

function openMap(){

    document
        .getElementById("mapFullscreen")
        .classList.add("open");


    setTimeout(()=>{

        fullMap.invalidateSize();

        fullMap.setView(
            [latitude,longitude],
            5
        );

    },100);

}


function closeMap(){

    document
        .getElementById("mapFullscreen")
        .classList.remove("open");

}


/* =========================================================
   LAYERS
========================================================= */

function changeLayer(layer){

    selectedLayer=layer;


    document
        .querySelectorAll(".layer-button")
        .forEach(button=>{
            button.classList.remove("active");
        });


    if(layer==="temperature"){

        document
            .getElementById("temperatureButton")
            .classList.add("active");

    }


    if(layer==="rain"){

        document
            .getElementById("rainButton")
            .classList.add("active");

    }


    if(layer==="wind"){

        document
            .getElementById("windButton")
            .classList.add("active");

    }

}


/* =========================================================
   SEARCH
========================================================= */

async function searchCity(){

    const city=
        document
            .getElementById("cityInput")
            .value
            .trim();


    if(!city)
        return;


    showLoading();


    try{

        const response=
            await fetch(
                `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=ru&format=json`
            );


        const data=
            await response.json();


        if(
            !data.results ||
            !data.results.length
        ){

            throw new Error(
                "Город не найден"
            );

        }


        const place=
            data.results[0];


        latitude=
            place.latitude;

        longitude=
            place.longitude;


        previewMap.setView(
            [latitude,longitude],
            6
        );


        fullMap.setView(
            [latitude,longitude],
            6
        );


        await loadWeather(
            latitude,
            longitude,
            place.name,
            place.country
        );


    }
    catch(error){

        showError(
            error.message
        );

    }

}


/* =========================================================
   WEATHER API
========================================================= */

async function loadWeather(
    lat,
    lon,
    city,
    country
){

    const url=
        `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}`+
        `&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,pressure_msl,wind_speed_10m,wind_direction_10m`+
        `&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max`+
        `&timezone=auto`;


    const response=
        await fetch(url);


    if(!response.ok){

        throw new Error(
            "Ошибка получения погоды"
        );

    }


    const data=
        await response.json();


    renderWeather(
        data,
        city,
        country
    );

}


/* =========================================================
   RENDER WEATHER
========================================================= */

function renderWeather(
    data,
    city,
    country
){

    const current=
        data.current;

    const daily=
        data.daily;

    const weather=
        getWeather(
            current.weather_code
        );


    document
        .getElementById("locationStatus")
        .textContent=
            country || "";


    const date=
        new Date();


    let html=`

        <div class="current">

            <div class="current-top">

                <div>

                    <div class="city">
                        ${city}
                    </div>

                    <div class="date">
                        ${formatDate(date)}
                    </div>

                </div>

                <div class="weather-icon">
                    ${weather[0]}
                </div>

            </div>


            <div class="temperature">
                ${Math.round(
                    current.temperature_2m
                )}°
            </div>


            <div class="description">
                ${weather[1]}
            </div>


            <div class="details">

                <div class="detail">
                    <div class="detail-title">
                        Ощущается
                    </div>
                    <div class="detail-value">
                        ${Math.round(
                            current.apparent_temperature
                        )}°
                    </div>
                </div>


                <div class="detail">
                    <div class="detail-title">
                        Влажность
                    </div>
                    <div class="detail-value">
                        ${current.relative_humidity_2m}%
                    </div>
                </div>


                <div class="detail">
                    <div class="detail-title">
                        Ветер
                    </div>
                    <div class="detail-value">
                        ${Math.round(
                            current.wind_speed_10m
                        )} км/ч
                    </div>
                </div>


                <div class="detail">
                    <div class="detail-title">
                        Давление
                    </div>
                    <div class="detail-value">
                        ${Math.round(
                            current.pressure_msl
                        )} hPa
                    </div>
                </div>


                <div class="detail">
                    <div class="detail-title">
                        Осадки
                    </div>
                    <div class="detail-value">
                        ${current.precipitation} мм
                    </div>
                </div>


                <div class="detail">
                    <div class="detail-title">
                        Максимум
                    </div>
                    <div class="detail-value">
                        ${Math.round(
                            daily.temperature_2m_max[0]
                        )}°
                    </div>
                </div>


                <div class="detail">
                    <div class="detail-title">
                        Минимум
                    </div>
                    <div class="detail-value">
                        ${Math.round(
                            daily.temperature_2m_min[0]
                        )}°
                    </div>
                </div>


                <div class="detail">
                    <div class="detail-title">
                        Вероятность осадков
                    </div>
                    <div class="detail-value">
                        ${daily.precipitation_probability_max[0]}%
                    </div>
                </div>

            </div>

        </div>


        <div class="section-title">
            Прогноз на 7 дней
        </div>


        <div class="forecast">
    `;


    for(let i=0;i<7;i++){

        const d=
            new Date(
                daily.time[i]+"T12:00:00"
            );


        const w=
            getWeather(
                daily.weather_code[i]
            );


        const dayName=
            i===0
                ? "Сегодня"
                : d.toLocaleDateString(
                    "ru-RU",
                    {
                        weekday:"short"
                    }
                );


        html+=`

            <div class="day">

                <div class="day-name">
                    ${dayName}
                </div>

                <div class="day-icon">
                    ${w[0]}
                </div>

                <div class="day-temp">
                    ${Math.round(
                        daily.temperature_2m_max[i]
                    )}°
                    /
                    ${Math.round(
                        daily.temperature_2m_min[i]
                    )}°
                </div>

                <div class="day-rain">
                    💧
                    ${daily.precipitation_probability_max[i]}%
                </div>

            </div>

        `;

    }


    html+=`
        </div>
    `;


    document
        .getElementById("weather")
        .innerHTML=
            html;

}


/* =========================================================
   HELPERS
========================================================= */

function formatDate(date){

    return date.toLocaleDateString(
        "ru-RU",
        {
            weekday:"long",
            day:"numeric",
            month:"long"
        }
    );

}


function showLoading(){

    document
        .getElementById("error")
        .style.display="none";


    document
        .getElementById("weather")
        .innerHTML=`
            <div class="loading">
                Загрузка погоды...
            </div>
        `;

}


function showError(message){

    const error=
        document
            .getElementById("error");


    error.textContent=
        message;


    error.style.display=
        "block";


    document
        .getElementById("weather")
        .innerHTML="";

}


/* ENTER */

document
    .getElementById("cityInput")
    .addEventListener(
        "keydown",
        function(e){

            if(e.key==="Enter"){
                searchCity();
            }

        }
    );


/* START */

createMaps();

searchCity();

</script>

</body>
</html>
