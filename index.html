<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Глобус восходящих потоков</title>

  <!-- MapLibre GL JS (рисует глобус) подключаем с CDN: ставить ничего не нужно -->
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css">
  <script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Космос рисуется на этом холсте (см. drawSpace в app.js) -->
  <canvas id="space"></canvas>

  <!-- Глобус. Вокруг шара фон прозрачный, поэтому виден космос -->
  <div id="map"></div>

  <aside id="panel">
    <h1>Где восходящие потоки</h1>

    <label class="row">
      Спутник
      <select id="satellite">
        <option value="GOES-East_ABI_Band13_Clean_Infrared">GOES-East (Америка, Атлантика)</option>
        <option value="GOES-West_ABI_Band13_Clean_Infrared">GOES-West (восток Тихого океана)</option>
        <option value="Himawari_AHI_Band13_Clean_Infrared" selected>Himawari (Азия, Австралия, запад Тихого)</option>
      </select>
    </label>

    <label class="row">
      Подложка
      <select id="basemap">
        <option value="sat" selected>Спутниковые снимки (Esri)</option>
        <option value="dark">Тёмная карта (Esri)</option>
      </select>
    </label>

    <label class="check"><input id="labels" type="checkbox" checked> Подписи стран и городов</label>

    <label class="row">
      Прозрачность ИК-слоя
      <input id="opacity" type="range" min="0.2" max="1" step="0.05" value="0.85">
    </label>

    <div class="detect">
      <label class="row">
        Порог обнаружения очагов: <b id="thr-label">−50 °C</b>
        <input id="threshold" type="range" min="-70" max="-40" step="5" value="-50">
      </label>
      <label class="check"><input id="show-ir" type="checkbox" checked> Показывать ИК-снимок</label>
      <div id="cells-count" class="legend-title"></div>
      <ol id="cells-list"></ol>
    </div>

    <div id="legend">
      <div class="legend-title">Температура вершин облаков</div>
      <div id="legend-bar"></div>
      <div id="legend-ticks"></div>
      <ul id="legend-cats"></ul>
    </div>

    <p class="disclaimer">Оценка, не прямое измерение. Холодная вершина облака намекает на мощную конвекцию, но реальную скорость потока по ней узнать нельзя.</p>
    <p id="status" role="status">Загрузка…</p>
    <pre id="diag"></pre>
  </aside>

  <script src="app.js"></script>
</body>
</html>
