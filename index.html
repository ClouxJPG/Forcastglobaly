<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Метео • Прогноз</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    min-height:100%;
    background:#060b12;
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

body{
    overflow-x:hidden;
}

.app{
    width:100%;
    max-width:1100px;
    margin:auto;
    padding:14px;
}

/* HEADER */

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.logo{
    font-size:26px;
    font-weight:800;
}

.logo span{
    color:#268cff;
}

.location-status{
    color:#8799ad;
    font-size:13px;
}

/* SEARCH */

.search{
    display:flex;
    gap:8px;
    margin-bottom:15px;
}

.search input{
    flex:1;
    height:50px;
    border:0;
    outline:0;
    border-radius:15px;
    padding:0 16px;
    background:#101a27;
    color:#fff;
    font-size:16px;
}

.search input::placeholder{
    color:#6e8094;
}

.search button{
    width:52px;
    border:0;
    border-radius:15px;
    background:#268cff;
    color:white;
    font-size:23px;
}

/* ERROR */

.error{
    display:none;
    background:#35151d;
    color:#ff9ba7;
    padding:13px;
    border-radius:14px;
    margin-bottom:14px;
}

/* CURRENT WEATHER */

.current{
    padding:22px;
    border-radius:24px;
    background:linear-gradient(145deg,#112d4c,#09141f);
    border:1px solid rgba(255,255,255,.06);
}

.current-top{
    display:flex;
    justify-content:space-between;
}

.city{
    font-size:27px;
    font-weight:750;
}

.date{
    margin-top:5px;
    color:#8b9caf;
    font-size:14px;
}

.weather-icon{
    font-size:52px;
}

.temperature{
    margin-top:10px;
    font-size:70px;
    line-height:1;
    font-weight:750;
}

.description{
    margin-top:8px;
    color:#c4cfda;
    font-size:18px;
}

.details{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:9px;
    margin-top:24px;
}

.detail{
    background:rgba(255,255,255,.05);
    border-radius:14px;
    padding:13px;
}

.detail-title{
    color:#7e91a7;
    font-size:12px;
    margin-bottom:6px;
}

.detail-value{
    font-size:15px;
    font-weight:650;
}

/* FORECAST */

.section-title{
    font-size:20px;
    font-weight:750;
    margin:24px 0 11px;
}

.forecast{
    display:flex;
    gap:9px;
    overflow-x:auto;
}

.forecast::-webkit-scrollbar{
    display:none;
}

.day{
    min-width:115px;
    padding:14px;
    text-align:center;
    border-radius:17px;
    background:#101a27;
}

.day-name{
    color:#9aabba;
    font-size:13px;
}

.day-icon{
    font-size:32px;
    margin:10px 0;
}

.day-temp{
    font-size:16px;
    font-weight:650;
}

.day-rain{
    margin-top:7px;
    color:#61aaff;
    font-size:12px;
}

/* MAP PREVIEW */

.map-preview{
    position:relative;
    height:380px;
    border-radius:22px;
    overflow:hidden;
    background:#070d15;
    border:1px solid rgba(255,255,255,.08);
}

#previewMap{
    width:100%;
    height:100%;
}

.preview-label{
    position:absolute;
    z-index:1000;
    left:12px;
    top:12px;
    padding:7px 10px;
    border-radius:9px;
    background:rgba(4,10,17,.9);
    color:#d3dce6;
    font-size:12px;
}

.open-map{
    position:absolute;
    z-index:1000;
    right:10px;
    bottom:10px;
    border:0;
    border-radius:11px;
    padding:10px 14px;
    background:rgba(4,10,17,.95);
    color:white;
    font-size:13px;
    font-weight:650;
}

/* FULLSCREEN MAP */

.fullscreen-map{
    display:none;
    position:fixed;
    z-index:99999;
    inset:0;
    width:100vw;
    height:100vh;
    background:#060b12;
}

.fullscreen-map.open{
    display:block;
}

#forecastMap{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
}

/* MAP TOP */

.map-top{
    position:absolute;
    z-index:10000;
    top:10px;
    left:10px;
    right:10px;

    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:8px;

    pointer-events:none;
}

.map-layers{
    display:flex;
    gap:5px;
    max-width:calc(100% - 100px);
    overflow-x:auto;
    padding:6px;
    border-radius:14px;
    background:rgba(4,10,17,.93);
    backdrop-filter:blur(12px);
    pointer-events:auto;
}

.map-layers::-webkit-scrollbar{
    display:none;
}

.layer{
    flex-shrink:0;
    border:0;
    border-radius:9px;
    padding:9px 12px;
    background:#111d2c;
    color:#aebdce;
    font-size:12px;
}

.layer.active{
    background:#268cff;
    color:#fff;
}

.close-map{
    flex-shrink:0;
    border:0;
    border-radius:11px;
    padding:10px 13px;
    background:rgba(4,10,17,.95);
    color:#fff;
    font-size:13px;
    font-weight:650;
    pointer-events:auto;
}

.map-loading{
    display:none;
    position:absolute;
    z-index:10001;
    top:72px;
    left:50%;
    transform:translateX(-50%);
    padding:9px 14px;
    border-radius:11px;
    background:rgba(4,10,17,.94);
    color:#d2dce7;
    font-size:12px;
}

/* LEGEND */

.legend{
    position:absolute;
    z-index:10000;
    left:12px;
    bottom:12px;
    min-width:220px;
    padding:13px;
    border-radius:14px;
    background:rgba(4,10,17,.94);
    backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.1);
    pointer-events:none;
}

.legend-title{
    color:#dce5ee;
    font-size:12px;
    margin-bottom:8px;
}

.legend-gradient{
    width:220px;
    height:10px;
    border-radius:10px;
}

.legend-values{
    display:flex;
    justify-content:space-between;
    width:220px;
    margin-top:5px;
    color:#8799ad;
    font-size:10px;
}

/* =========================================
   RADAR VIEWER
========================================= */

.radar-viewer{
    display:none;

    position:fixed;
    z-index:100000;

    inset:0;

    width:100vw;
    height:100vh;

    background:#02050a;

    overflow:hidden;

    touch-action:none;
}

.radar-viewer.open{
    display:block;
}

.radar-stage{
    position:absolute;

    left:50%;
    top:50%;

    width:100vw;
    height:100vh;

    transform:
        translate3d(-50%,-50%,0)
        translate3d(0,0,0)
        rotate(0deg)
        scale(1);

    transform-origin:50% 50%;

    will-change:transform;

    display:flex;
    align-items:center;
    justify-content:center;

    touch-action:none;
}

.radar-image{
    display:block;

    max-width:none;
    max-height:none;

    width:auto;
    height:auto;

    image-rendering:pixelated;
    image-rendering:crisp-edges;

    user-select:none;
    -webkit-user-drag:none;

    pointer-events:none;

    will-change:transform;
}

/* RADAR HEADER */

.radar-header{
    position:absolute;

    z-index:20;

    top:10px;
    left:10px;
    right:10px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    pointer-events:none;
}

.radar-title{
    padding:9px 12px;

    border-radius:12px;

    background:rgba(3,8,14,.92);

    backdrop-filter:blur(12px);

    font-size:13px;
    color:#dce6ef;

    pointer-events:auto;
}

.radar-close{
    border:0;

    padding:10px 13px;

    border-radius:11px;

    background:rgba(3,8,14,.95);

    color:#fff;

    font-size:13px;
    font-weight:650;

    pointer-events:auto;
}

/* RADAR CONTROLS */

.radar-controls{
    position:absolute;
    z-index:20;

    right:14px;
    top:50%;
    bottom:auto;

    transform:translateY(-50%);

    display:flex;
    flex-direction:column;
    gap:9px;
}

.radar-control{
    width:52px;
    height:52px;

    border:0;
    border-radius:15px;

    background:rgba(3,8,14,.94);

    color:white;

    font-size:23px;
    font-weight:600;

    backdrop-filter:blur(12px);

    box-shadow:0 3px 15px rgba(0,0,0,.35);
}

/* RADAR HELP */

.radar-help{
    position:absolute;

    z-index:20;

    left:50%;
    bottom:12px;

    transform:translateX(-50%);

    padding:8px 12px;

    border-radius:11px;

    background:rgba(3,8,14,.8);

    color:#93a5b8;

    font-size:11px;

    white-space:nowrap;

    pointer-events:none;
}

/* LEAFLET */

.leaflet-container{
    background:#060b12;
}

.leaflet-control-zoom a{
    background:#111d2c!important;
    color:#fff!important;
    border-color:#293a4d!important;
}

.leaflet-control-attribution{
    background:rgba(4,10,17,.8)!important;
    color:#6f8195!important;
}

.leaflet-control-attribution a{
    color:#73aaff!important;
}

/* MOBILE */

@media(max-width:650px){

    .app{
        padding:12px;
    }

    .details{
        grid-template-columns:repeat(2,1fr);
    }

    .temperature{
        font-size:61px;
    }

    .map-preview{
        height:330px;
    }

    .map-top{
        top:7px;
        left:7px;
        right:7px;
    }

    .map-layers{
        max-width:calc(100% - 95px);
    }

    .layer{
        padding:8px 10px;
    }

    .close-map{
        padding:9px 10px;
    }

    .legend{
        left:7px;
        bottom:7px;
    }

    .radar-help{
        bottom:8px;
        font-size:10px;
    }

    .radar-controls{
        right:10px;
        gap:8px;
    }

    .radar-control{
        width:50px;
        height:50px;
    }

}

</style>
</head>

<body>

<div class="app">

<header>

    <div class="logo">
        Метео<span>•</span>
    </div>

    <div id="locationStatus"
         class="location-status">
        Город не выбран
    </div>

</header>

<div class="search">

    <input
        id="cityInput"
        value="Уфа"
        placeholder="Введите город..."
    >

    <button onclick="searchCity()">
        ⌕
    </button>

</div>

<div id="error"
     class="error">
</div>

<div id="weather">

    <div style="
        padding:30px;
        text-align:center;
        color:#8799ad;
    ">
        Загрузка прогноза...
    </div>

</div>

<div class="section-title">
    Карта прогнозов
</div>

<div class="map-preview">

    <div id="previewMap"></div>

    <div class="preview-label">
        DWD ICON • осадки
    </div>

    <button
        class="open-map"
        onclick="openForecastMap()">

        Открыть карту

    </button>

</div>

</div>


<!-- FULLSCREEN FORECAST MAP -->

<div id="fullscreenMap"
     class="fullscreen-map">

    <div id="forecastMap"></div>

    <div class="map-top">

        <div class="map-layers">

            <button
                id="precipitationLayer"
                class="layer active"
                onclick="setLayer('precipitation')">

                🌧 Осадки

            </button>

            <button
                id="radarLayer"
                class="layer"
                onclick="openRadarViewer()">

                📡 Радарная-GIF

            </button>

        </div>

        <button
            class="close-map"
            onclick="closeForecastMap()">

            Закрыть карту

        </button>

    </div>

    <div id="mapLoading"
         class="map-loading">

        Загрузка прогноза...

    </div>

    <div id="precipLegend"
         class="legend">

        <div class="legend-title">
            Осадки, мм/ч
        </div>

        <div
            class="legend-gradient"
            style="
            background:
            linear-gradient(
                90deg,
                #469cff,
                #2055e8,
                #6b2bd5,
                #bd25a9,
                #ed2450
            );
            ">
        </div>

        <div class="legend-values">

            <span>0</span>
            <span>0.2</span>
            <span>1</span>
            <span>7</span>
            <span>15+</span>

        </div>

    </div>

</div>


<!-- RADAR VIEWER -->

<div id="radarViewer"
     class="radar-viewer">

    <div class="radar-stage"
         id="radarStage">

        <img
            id="radarImage"
            class="radar-image"
            alt="Meteoinfo Radar">

    </div>

    <div class="radar-header">

        <div class="radar-title">
            📡 Meteoinfo • Radar
        </div>

        <button
            class="radar-close"
            onclick="closeRadarViewer()">

            Закрыть

        </button>

    </div>

    <div class="radar-controls">

        <button
            class="radar-control"
            onclick="radarZoom(1.25)">

            +

        </button>

        <button
            class="radar-control"
            onclick="radarZoom(.8)">

            −

        </button>

        <button
            class="radar-control"
            onclick="radarRotate(-15)">

            ↶

        </button>

        <button
            class="radar-control"
            onclick="radarRotate(15)">

            ↷

        </button>

        <button
            class="radar-control"
            onclick="resetRadarTransform()">

            ⟳

        </button>

    </div>

    <div class="radar-help">

        Два пальца: масштаб + вращение • Один палец: перемещение

    </div>

</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* =========================================
   GLOBAL
========================================= */

let latitude = 54.7388;
let longitude = 55.9721;

let previewMap;
let forecastMap;

let marker;

let selectedLayer = "precipitation";

let gridData = [];
let gridMeta = null;

let forecastCanvas = null;

let gridRows = 15;
let gridCols = 15;

let renderToken = 0;


/* =========================================
   WEATHER CODES
========================================= */

const weatherCodes = {

    0:["☀️","Ясно"],
    1:["🌤️","Преимущественно ясно"],
    2:["⛅","Переменная облачность"],
    3:["☁️","Пасмурно"],

    45:["🌫️","Туман"],
    48:["🌫️","Изморозь"],

    51:["🌦️","Морось"],
    53:["🌦️","Морось"],
    55:["🌧️","Сильная морось"],

    56:["🌧️","Ледяная морось"],
    57:["🌧️","Сильная ледяная морось"],

    61:["🌧️","Небольшой дождь"],
    63:["🌧️","Дождь"],
    65:["🌧️","Сильный дождь"],

    66:["🌧️","Ледяной дождь"],
    67:["🌧️","Сильный ледяной дождь"],

    71:["🌨️","Небольшой снег"],
    73:["🌨️","Снег"],
    75:["❄️","Сильный снег"],

    77:["🌨️","Снежные зерна"],

    80:["🌦️","Ливень"],
    81:["🌧️","Сильный ливень"],
    82:["⛈️","Очень сильный ливень"],

    85:["🌨️","Снегопад"],
    86:["❄️","Сильный снегопад"],

    95:["⛈️","Гроза"],
    96:["⛈️","Гроза с градом"],
    99:["⛈️","Сильная гроза с градом"]

};


function getWeather(code){

    return weatherCodes[code]
        || ["🌡️","Неизвестно"];

}


/* =========================================
   MAPS
========================================= */

function createMaps(){

    previewMap =
        L.map(
            "previewMap",
            {
                zoomControl:false,
                attributionControl:false,
                scrollWheelZoom:false
            }
        )
        .setView(
            [latitude,longitude],
            5
        );

    L.tileLayer(
        "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
        {
            maxZoom:20,
            subdomains:"abcd"
        }
    ).addTo(
        previewMap
    );


    forecastMap =
        L.map(
            "forecastMap",
            {
                zoomControl:true,
                attributionControl:true
            }
        )
        .setView(
            [latitude,longitude],
            5
        );

    L.tileLayer(
        "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
        {
            maxZoom:20,
            subdomains:"abcd",
            attribution:"© OpenStreetMap © CARTO"
        }
    ).addTo(
        forecastMap
    );


    forecastMap.on(
        "moveend",
        function(){

            if(
                selectedLayer === "precipitation" &&
                document
                .getElementById("fullscreenMap")
                .classList
                .contains("open")
            ){

                loadForecastGrid();

            }

        }
    );

}


/* =========================================
   MARKER
========================================= */

function updateMarker(){

    if(marker){

        forecastMap.removeLayer(marker);

    }

    marker =
        L.circleMarker(
            [
                latitude,
                longitude
            ],
            {
                radius:6,
                color:"#fff",
                weight:2,
                fillColor:"#268cff",
                fillOpacity:1
            }
        )
        .addTo(
            forecastMap
        );

}


/* =========================================
   MAP OPEN / CLOSE
========================================= */

function openForecastMap(){

    document
    .getElementById("fullscreenMap")
    .classList
    .add("open");

    setTimeout(
        function(){

            forecastMap.invalidateSize();

            forecastMap.setView(
                [
                    latitude,
                    longitude
                ],
                6
            );

            updateMarker();

            setLayer("precipitation");

        },
        100
    );

}


function closeForecastMap(){

    document
    .getElementById("fullscreenMap")
    .classList
    .remove("open");

}


/* =========================================
   MAP LOADING
========================================= */

function showMapLoading(show){

    document
    .getElementById("mapLoading")
    .style.display =
        show ? "block" : "none";

}


/* =========================================
   PRECIPITATION COLORS
========================================= */

function precipitationColor(value){

    if(
        value === null ||
        value === undefined ||
        !isFinite(value)
    ){

        return [0,0,0,0];

    }

    if(value <= 0.05){

        return [0,0,0,0];

    }

    if(value <= 0.2){

        return [70,170,255,100];

    }

    if(value <= 1){

        return [30,125,255,145];

    }

    if(value <= 3){

        return [30,75,235,180];

    }

    if(value <= 7){

        return [100,35,220,195];

    }

    if(value <= 15){

        return [190,25,170,215];

    }

    if(value <= 30){

        return [240,25,65,230];

    }

    return [145,0,25,240];

}


/* =========================================
   DRAW PRECIPITATION
========================================= */

function drawPrecipitation(){

    if(
        !gridData.length ||
        !gridMeta
    ){

        return;

    }


    if(forecastCanvas){

        forecastCanvas.remove();

        forecastCanvas = null;

    }


    const canvas =
        document.createElement("canvas");

    canvas.width = 600;
    canvas.height = 600;


    const bounds =
        L.latLngBounds(
            [
                gridMeta.latMin,
                gridMeta.lonMin
            ],
            [
                gridMeta.latMax,
                gridMeta.lonMax
            ]
        );


    const overlay =
        L.DomUtil.create(
            "div",
            "precipitation-overlay",
            forecastMap
            .getPanes()
            .overlayPane
        );


    overlay.style.position = "absolute";
    overlay.style.pointerEvents = "none";
    overlay.style.zIndex = "450";

    overlay.appendChild(canvas);

    forecastCanvas = overlay;


    function render(){

        const nw =
            forecastMap
            .latLngToLayerPoint(
                bounds.getNorthWest()
            );


        const se =
            forecastMap
            .latLngToLayerPoint(
                bounds.getSouthEast()
            );


        const width =
            Math.max(
                1,
                se.x - nw.x
            );


        const height =
            Math.max(
                1,
                se.y - nw.y
            );


        overlay.style.left =
            nw.x + "px";

        overlay.style.top =
            nw.y + "px";

        overlay.style.width =
            width + "px";

        overlay.style.height =
            height + "px";


        canvas.style.width =
            width + "px";

        canvas.style.height =
            height + "px";


        const ctx =
            canvas.getContext("2d");


        const image =
            ctx.createImageData(
                canvas.width,
                canvas.height
            );


        const pixels =
            image.data;


        function valueAt(gx,gy){

            gx =
                Math.max(
                    0,
                    Math.min(
                        gridCols-1,
                        gx
                    )
                );


            gy =
                Math.max(
                    0,
                    Math.min(
                        gridRows-1,
                        gy
                    )
                );


            const x0 =
                Math.floor(gx);

            const y0 =
                Math.floor(gy);

            const x1 =
                Math.min(
                    x0+1,
                    gridCols-1
                );

            const y1 =
                Math.min(
                    y0+1,
                    gridRows-1
                );


            const a =
                gridData[
                    y0*gridCols+x0
                ]?.precipitation;

            const b =
                gridData[
                    y0*gridCols+x1
                ]?.precipitation;

            const c =
                gridData[
                    y1*gridCols+x0
                ]?.precipitation;

            const d =
                gridData[
                    y1*gridCols+x1
                ]?.precipitation;


            if(
                [a,b,c,d].some(
                    v =>
                    v === null ||
                    v === undefined ||
                    !isFinite(v)
                )
            ){

                return null;

            }


            const fx = gx-x0;
            const fy = gy-y0;


            const top =
                a+(b-a)*fx;

            const bottom =
                c+(d-c)*fx;


            return top+
                (bottom-top)*fy;

        }


        for(
            let y=0;
            y<canvas.height;
            y++
        ){

            for(
                let x=0;
                x<canvas.width;
                x++
            ){

                const gx =
                    x/
                    (canvas.width-1)*
                    (gridCols-1);


                const gy =
                    y/
                    (canvas.height-1)*
                    (gridRows-1);


                const value =
                    valueAt(gx,gy);


                const color =
                    precipitationColor(value);


                const index =
                    (y*canvas.width+x)*4;


                pixels[index] =
                    color[0];

                pixels[index+1] =
                    color[1];

                pixels[index+2] =
                    color[2];

                pixels[index+3] =
                    color[3];

            }

        }


        ctx.putImageData(
            image,
            0,
            0
        );

    }


    forecastMap.on(
        "zoom move resize",
        render
    );


    render();

}


/* =========================================
   LOAD ICON GRID
========================================= */

async function loadForecastGrid(){

    const token =
        ++renderToken;

    showMapLoading(true);


    const center =
        forecastMap.getCenter();


    const zoom =
        forecastMap.getZoom();


    let latSpan;
    let lonSpan;


    if(zoom<=4){

        latSpan=10;
        lonSpan=15;

    }
    else if(zoom===5){

        latSpan=7;
        lonSpan=11;

    }
    else if(zoom===6){

        latSpan=4.5;
        lonSpan=7;

    }
    else{

        latSpan=3;
        lonSpan=4.5;

    }


    const latMin =
        center.lat-latSpan/2;

    const latMax =
        center.lat+latSpan/2;

    const lonMin =
        center.lng-lonSpan/2;

    const lonMax =
        center.lng+lonSpan/2;


    const rows=15;
    const cols=15;

    const locations=[];


    for(
        let y=0;
        y<rows;
        y++
    ){

        const lat =
            latMin+
            (latMax-latMin)*
            y/(rows-1);


        for(
            let x=0;
            x<cols;
            x++
        ){

            const lon =
                lonMin+
                (lonMax-lonMin)*
                x/(cols-1);


            locations.push({
                lat,
                lon
            });

        }

    }


    const chunkSize=30;
    const allResults=[];


    try{

        for(
            let start=0;
            start<locations.length;
            start+=chunkSize
        ){

            if(
                token!==renderToken
            ){

                return;

            }


            const chunk =
                locations.slice(
                    start,
                    start+chunkSize
                );


            const latitudes =
                chunk
                .map(
                    p=>p.lat.toFixed(4)
                )
                .join(",");


            const longitudes =
                chunk
                .map(
                    p=>p.lon.toFixed(4)
                )
                .join(",");


            const url =
                "https://api.open-meteo.com/v1/dwd-icon"+
                "?latitude="+
                encodeURIComponent(latitudes)+
                "&longitude="+
                encodeURIComponent(longitudes)+
                "&hourly=precipitation"+
                "&forecast_hours=1"+
                "&timezone=GMT";


            const response =
                await fetch(url);


            if(!response.ok){

                throw new Error(
                    "ICON HTTP "+
                    response.status
                );

            }


            const data =
                await response.json();


            const results =
                Array.isArray(data)
                ? data
                : [data];


            allResults.push(
                ...results
            );

        }


        if(
            token!==renderToken
        ){

            return;

        }


        gridData =
            allResults.map(
                item => ({

                    precipitation:
                        item.hourly &&
                        item.hourly.precipitation
                        ? item.hourly.precipitation[0]
                        : 0

                })
            );


        gridRows=rows;
        gridCols=cols;


        gridMeta={

            latMin,
            latMax,
            lonMin,
            lonMax

        };


        drawPrecipitation();

    }
    catch(error){

        console.error(
            "ICON ERROR:",
            error
        );

    }
    finally{

        if(
            token===renderToken
        ){

            showMapLoading(false);

        }

    }

}

/* =========================================
   RADAR
========================================= */

const radarViewer =
    document.getElementById(
        "radarViewer"
    );


const radarStage =
    document.getElementById(
        "radarStage"
    );


const radarImage =
    document.getElementById(
        "radarImage"
    );


let radarScale=1;
let radarRotation=0;
let radarX=0;
let radarY=0;


let pointers=new Map();

let gestureMode="none";

let startDistance=0;
let startAngle=0;

let startScale=1;
let startRotation=0;

let startCenterX=0;
let startCenterY=0;

let startX=0;
let startY=0;

let startTranslateX=0;
let startTranslateY=0;


/* =========================================
   OPEN RADAR

   LOAD RADAR GIF
========================================= */

}


setInterval(
    function(){

            .contains("open")
        ){

            /*
             * При обновлении GIF
             * трансформация НЕ сбрасывается.
             */

                radarScale;

            const currentRotation =
                radarRotation;

            const currentX =
                radarX;

            const currentY =

            radarY =

        }

    },

);


/* =========================================
   RADAR TRANSFORM
========================================= */

function updateRadarTransform(){

    radarStage.style.transform =
        "translate3d(-50%,-50%,0)"+
        "translate3d("+
        radarX+
        "px,"+
        radarY+
        "px,0)"+
        "rotate("+
        radarRotation+
        "deg)"+
        "scale("+
        radarScale+
        ")";

}


/* =========================================
   ZOOM
========================================= */

function radarZoom(factor){

    radarScale *= factor;


    radarScale =
        Math.max(
            0.15,
            Math.min(
                20,
                radarScale
            )
        );


    updateRadarTransform();

}


/* =========================================
   ROTATE
========================================= */

function radarRotate(deg){

    radarRotation += deg;

    updateRadarTransform();

}


/* =========================================
   RESET
========================================= */

function resetRadarTransform(){

    radarScale=1;

    radarRotation=0;

    radarX=0;

    radarY=0;

    updateRadarTransform();

}


/* =========================================
   POINTER HELPERS
========================================= */

function distance(a,b){

    const dx =
        b.x-a.x;

    const dy =
        b.y-a.y;


    return Math.sqrt(
        dx*dx+
        dy*dy
    );

}


function angle(a,b){

    return Math.atan2(
        b.y-a.y,
        b.x-a.x
    )*
    180/
    Math.PI;

}


function center(a,b){

    return {

        x:(a.x+b.x)/2,

        y:(a.y+b.y)/2

    };

}


/* =========================================
   POINTER DOWN
========================================= */

radarViewer.addEventListener(
    "pointerdown",
    function(e){

        e.preventDefault();


        pointers.set(
            e.pointerId,
            {
                x:e.clientX,
                y:e.clientY
            }
        );


        /*
         * Один палец.
         */

        if(
            pointers.size===1
        ){

            gestureMode="pan";


            startX=e.clientX;
            startY=e.clientY;


            startTranslateX=
                radarX;

            startTranslateY=
                radarY;

        }


        /*
         * Второй палец.
         */

        if(
            pointers.size===2
        ){

            const pts =
                Array.from(
                    pointers.values()
                );


            startDistance =
                distance(
                    pts[0],
                    pts[1]
                );


            startAngle =
                angle(
                    pts[0],
                    pts[1]
                );


            const c =
                center(
                    pts[0],
                    pts[1]
                );


            startCenterX=c.x;
            startCenterY=c.y;


            startScale=
                radarScale;

            startRotation=
                radarRotation;


            startTranslateX=
                radarX;

            startTranslateY=
                radarY;


            gestureMode=
                "transform";

        }

    },
    {
        passive:false
    }
);


/* =========================================
   POINTER MOVE
========================================= */

radarViewer.addEventListener(
    "pointermove",
    function(e){

        if(
            !pointers.has(
                e.pointerId
            )
        ){

            return;

        }


        e.preventDefault();


        pointers.set(
            e.pointerId,
            {
                x:e.clientX,
                y:e.clientY
            }
        );


        /*
         * Один палец.
         */

        if(
            pointers.size===1 &&
            gestureMode==="pan"
        ){

            radarX =
                startTranslateX+
                (
                    e.clientX-
                    startX
                );


            radarY =
                startTranslateY+
                (
                    e.clientY-
                    startY
                );


            updateRadarTransform();

            return;

        }


        /*
         * Два пальца.
         */

        if(
            pointers.size===2
        ){

            const pts =
                Array.from(
                    pointers.values()
                );


            const currentDistance =
                distance(
                    pts[0],
                    pts[1]
                );


            const currentAngle =
                angle(
                    pts[0],
                    pts[1]
                );


            const currentCenter =
                center(
                    pts[0],
                    pts[1]
                );


            /*
             * Масштаб.
             */

            const scaleFactor =
                currentDistance/
                startDistance;


            radarScale =
                startScale*
                scaleFactor;


            radarScale =
                Math.max(
                    0.15,
                    Math.min(
                        20,
                        radarScale
                    )
                );


            /*
             * Вращение.
             */

            radarRotation =
                startRotation+
                (
                    currentAngle-
                    startAngle
                );


            /*
             * Перемещение центра.
             */

            radarX =
                startTranslateX+
                (
                    currentCenter.x-
                    startCenterX
                );


            radarY =
                startTranslateY+
                (
                    currentCenter.y-
                    startCenterY
                );


            updateRadarTransform();

        }

    },
    {
        passive:false
    }
);


/* =========================================
   POINTER UP
========================================= */

radarViewer.addEventListener(
    "pointerup",
    function(e){

        e.preventDefault();


        pointers.delete(
            e.pointerId
        );


        /*
         * ВАЖНО:
         *
         * Никакие значения трансформации
         * здесь не сбрасываются.
         *
         * Поэтому после отпускания
         * пальцев GIF остаётся там,
         * где пользователь её оставил.
         */

        if(
            pointers.size===0
        ){

            gestureMode="none";

            return;

        }


        /*
         * Если остался один палец,
         * продолжаем pan без скачка.
         */

        if(
            pointers.size===1
        ){

            const remaining =
                Array.from(
                    pointers.values()
                )[0];


            gestureMode="pan";


            startX=
                remaining.x;

            startY=
                remaining.y;


            startTranslateX=
                radarX;

            startTranslateY=
                radarY;

        }

    },
    {
        passive:false
    }
);


/* =========================================
   POINTER CANCEL
========================================= */

radarViewer.addEventListener(
    "pointercancel",
    function(e){

        pointers.delete(
            e.pointerId
        );


        /*
         * Ничего не сбрасываем.
         */

        if(
            pointers.size===0
        ){

            gestureMode="none";

        }

    },
    {
        passive:false
    }
);


/* =========================================
   DOUBLE TAP RESET
========================================= */

let lastTap=0;


radarViewer.addEventListener(
    "pointerup",
    function(){

        const now=Date.now();


        if(
            now-lastTap<300 &&
            pointers.size===0
        ){

            resetRadarTransform();

        }


        lastTap=now;

    }
);


/* =========================================
   SEARCH
========================================= */

async function searchCity(){

    const city =
        document
        .getElementById("cityInput")
        .value
        .trim();


    if(!city)
        return;


    showLoading();


    try{

        const response =
            await fetch(
                "https://geocoding-api.open-meteo.com/v1/search"+
                "?name="+
                encodeURIComponent(city)+
                "&count=1"+
                "&language=ru"+
                "&format=json"
            );


        if(!response.ok)
            throw new Error();


        const data =
            await response.json();


        if(
            !data.results ||
            !data.results.length
        ){

            throw new Error();

        }


        const place =
            data.results[0];


        latitude=
            place.latitude;

        longitude=
            place.longitude;


        previewMap.setView(
            [
                latitude,
                longitude
            ],
            6
        );


        forecastMap.setView(
            [
                latitude,
                longitude
            ],
            6
        );


        updateMarker();


        await loadWeather(
            latitude,
            longitude,
            place.name
        );

    }
    catch(error){

        document
        .getElementById(
            "locationStatus"
        )
        .textContent=
            "Город не выбран";


        showError(
            "Город не найден"
        );

    }

}


/* =========================================
   LOAD WEATHER
========================================= */

async function loadWeather(
    lat,
    lon,
    city
){

    const url =
        "https://api.open-meteo.com/v1/dwd-icon"+
        "?latitude="+lat+
        "&longitude="+lon+

        "&current="+
        "temperature_2m,"+
        "relative_humidity_2m,"+
        "apparent_temperature,"+
        "precipitation,"+
        "weather_code,"+
        "pressure_msl,"+
        "wind_speed_10m,"+
        "wind_direction_10m"+

        "&daily="+
        "weather_code,"+
        "temperature_2m_max,"+
        "temperature_2m_min,"+
        "precipitation_probability_max"+

        "&forecast_days=7"+
        "&timezone=auto";


    try{

        const response =
            await fetch(url);


        if(!response.ok)
            throw new Error();


        const data =
            await response.json();


        document
        .getElementById(
            "locationStatus"
        )
        .textContent=
            city;


        renderWeather(
            data,
            city
        );

    }
    catch(error){

        console.error(error);

        document
        .getElementById(
            "locationStatus"
        )
        .textContent=
            "Город не выбран";


        showError(
            "Не удалось загрузить прогноз"
        );

    }

}


/* =========================================
   RENDER WEATHER
========================================= */

function renderWeather(
    data,
    city
){

    const c=data.current;
    const d=data.daily;

    const weather =
        getWeather(
            c.weather_code
        );


    const windDirection =
        getWindDirection(
            c.wind_direction_10m
        );


    let html=`

    <div class="current">

        <div class="current-top">

            <div>

                <div class="city">
                    ${city}
                </div>

                <div class="date">
                    ${formatDate(new Date())}
                </div>

            </div>

            <div class="weather-icon">
                ${weather[0]}
            </div>

        </div>


        <div class="temperature">
            ${Math.round(c.temperature_2m)}°
        </div>


        <div class="description">
            ${weather[1]}
        </div>


        <div class="details">

            <div class="detail">

                <div class="detail-title">
                    Ощущается
                </div>

                <div class="detail-value">
                    ${Math.round(c.apparent_temperature)}°
                </div>

            </div>


            <div class="detail">

                <div class="detail-title">
                    Влажность
                </div>

                <div class="detail-value">
                    ${c.relative_humidity_2m}%
                </div>

            </div>


            <div class="detail">

                <div class="detail-title">
                    Ветер
                </div>

                <div class="detail-value">
                    ${windDirection}
                    ${Math.round(c.wind_speed_10m)} км/ч
                </div>

            </div>


            <div class="detail">

                <div class="detail-title">
                    Направление
                </div>

                <div class="detail-value">
                    ${Math.round(c.wind_direction_10m)}°
                </div>

            </div>


            <div class="detail">

                <div class="detail-title">
                    Давление
                </div>

                <div class="detail-value">
                    ${Math.round(c.pressure_msl)} hPa
                </div>

            </div>


            <div class="detail">

                <div class="detail-title">
                    Осадки
                </div>

                <div class="detail-value">
                    ${c.precipitation} мм
                </div>

            </div>


            <div class="detail">

                <div class="detail-title">
                    Максимум
                </div>

                <div class="detail-value">
                    ${Math.round(
                        d.temperature_2m_max[0]
                    )}°
                </div>

            </div>


            <div class="detail">

                <div class="detail-title">
                    Вероятность осадков
                </div>

                <div class="detail-value">
                    ${d.precipitation_probability_max[0]}%
                </div>

            </div>

        </div>

    </div>


    <div class="section-title">
        Прогноз на 7 дней
    </div>


    <div class="forecast">
    `;


    for(
        let i=0;
        i<7;
        i++
    ){

        const date =
            new Date(
                d.time[i]+"T12:00:00"
            );


        const dayWeather =
            getWeather(
                d.weather_code[i]
            );


        const name =
            i===0
            ? "Сегодня"
            : date.toLocaleDateString(
                "ru-RU",
                {
                    weekday:"short"
                }
            );


        html+=`

        <div class="day">

            <div class="day-name">

            </div>

            <div class="day-icon">

            </div>

            <div class="day-temp">
                ${Math.round(
                    d.temperature_2m_max[i]
                )}°

                    d.temperature_2m_min[i]
                )}°
            </div>

            <div class="day-rain">
                💧
                ${d.precipitation_probability_max[i]}%
            </div>

        </div>

    }


    html+=`
    </div>
    `;


    document
    .getElementById("weather")
    .innerHTML=html;

}


/* =========================================
   WIND
========================================= */

function getWindDirection(deg){

    const directions=[
        "С",
        "СВ",
        "В",
        "ЮВ",
        "Ю",
        "ЮЗ",
        "З",
        "СЗ"
    ];


    return directions[
        Math.round(deg/45)%8
    ];

}


/* =========================================
   DATE
========================================= */

function formatDate(date){

    return date.toLocaleDateString(
        "ru-RU",
        {
            weekday:"long",
            day:"numeric",
            month:"long"
        }
    );

}
