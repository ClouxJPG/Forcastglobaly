<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no">

<title>Метео</title>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    background:#050a10;
    color:white;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
}

body{
    overflow-x:hidden;
}

button,
input{
    font-family:inherit;
}

/* =====================================================
   MAIN
===================================================== */

.app{
    max-width:1100px;
    margin:auto;
    padding:14px;
}

header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
}

.logo{
    font-size:26px;
    font-weight:800;
}

.logo span{
    color:#268cff;
}

.location{
    color:#8496a9;
    font-size:13px;
}

/* =====================================================
   SEARCH
===================================================== */

.search{
    display:flex;
    gap:8px;
    margin-bottom:14px;
}

.search input{
    flex:1;
    height:50px;
    padding:0 15px;

    border:none;
    outline:none;

    border-radius:15px;

    background:#101a26;
    color:white;

    font-size:16px;
}

.search button{
    width:52px;
    height:50px;

    border:none;
    border-radius:15px;

    background:#268cff;
    color:white;

    font-size:23px;
}

/* =====================================================
   ERROR
===================================================== */

.error{
    display:none;

    padding:12px;
    margin-bottom:12px;

    border-radius:13px;

    background:#35151c;
    color:#ff9ca8;
}

/* =====================================================
   CURRENT WEATHER
===================================================== */

.current{
    padding:22px;

    border-radius:24px;

    background:
        linear-gradient(
            145deg,
            #122e4b,
            #09131e
        );
}

.current-top{
    display:flex;
    justify-content:space-between;
}

.city{
    font-size:27px;
    font-weight:750;
}

.date{
    margin-top:5px;
    color:#899aaa;
    font-size:13px;
}

.weather-icon{
    font-size:50px;
}

.temperature{
    margin-top:13px;

    font-size:68px;
    line-height:1;

    font-weight:750;
}

.description{
    margin-top:8px;

    color:#c6d0da;
    font-size:18px;
}

.details{
    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:9px;

    margin-top:23px;
}

.detail{
    padding:12px;

    border-radius:14px;

    background:rgba(255,255,255,.05);
}

.detail-title{
    margin-bottom:5px;

    color:#7f91a5;
    font-size:11px;
}

.detail-value{
    font-size:14px;
    font-weight:650;
}

/* =====================================================
   FORECAST
===================================================== */

.section-title{
    margin:23px 0 10px;

    font-size:20px;
    font-weight:750;
}

.forecast{
    display:flex;
    gap:9px;

    overflow-x:auto;
}

.forecast::-webkit-scrollbar{
    display:none;
}

.day{
    min-width:115px;

    padding:14px;

    text-align:center;

    border-radius:17px;

    background:#101a27;
}

.day-name{
    color:#94a5b7;
    font-size:13px;
}

.day-icon{
    margin:9px 0;
    font-size:32px;
}

.day-temp{
    font-weight:650;
}

.day-rain{
    margin-top:6px;

    color:#62aaff;
    font-size:12px;
}

/* =====================================================
   MAP PREVIEW
===================================================== */

.map-preview{
    position:relative;

    height:390px;

    overflow:hidden;

    border-radius:22px;

    background:#060b12;
}

#previewMap{
    width:100%;
    height:100%;
}

.preview-label{
    position:absolute;

    z-index:1000;

    left:10px;
    top:10px;

    padding:7px 10px;

    border-radius:9px;

    background:rgba(4,9,15,.9);

    font-size:12px;
}

.open-map{
    position:absolute;

    z-index:1000;

    right:10px;
    bottom:10px;

    padding:11px 15px;

    border:none;
    border-radius:12px;

    background:rgba(4,9,15,.96);

    color:white;

    font-size:14px;
    font-weight:650;
}

/* =====================================================
   FULL MAP
===================================================== */

.fullscreen-map{
    display:none;

    position:fixed;

    inset:0;

    z-index:50000;

    background:#050a10;
}

.fullscreen-map.open{
    display:block;
}

#forecastMap{
    position:absolute;

    inset:0;
}

.map-top{
    position:absolute;

    z-index:10000;

    top:8px;
    left:8px;
    right:8px;

    display:flex;

    justify-content:space-between;

    gap:8px;

    pointer-events:none;
}

.map-layers{
    display:flex;

    gap:5px;

    max-width:
        calc(100% - 100px);

    overflow-x:auto;

    padding:5px;

    border-radius:13px;

    background:rgba(4,9,15,.94);

    pointer-events:auto;
}

.map-layers::-webkit-scrollbar{
    display:none;
}

.layer{
    flex-shrink:0;

    padding:9px 12px;

    border:none;
    border-radius:9px;

    background:#111d2b;

    color:#aab9c9;
}

.layer.active{
    background:#268cff;
    color:white;
}

.close-map{
    padding:10px 12px;

    border:none;
    border-radius:11px;

    background:rgba(4,9,15,.95);

    color:white;

    pointer-events:auto;
}

/* =====================================================
   LEGEND
===================================================== */

.legend{
    position:absolute;

    z-index:10000;

    left:10px;
    bottom:10px;

    padding:12px;

    border-radius:13px;

    background:rgba(4,9,15,.94);
}

.legend-title{
    margin-bottom:7px;

    font-size:12px;
}

.gradient{
    width:220px;
    height:10px;

    border-radius:10px;

    background:
        linear-gradient(
            90deg,
            #469cff,
            #2055e8,
            #6b2bd5,
            #bd25a9,
            #ed2450
        );
}

.legend-values{
    display:flex;

    justify-content:space-between;

    margin-top:4px;

    color:#8293a5;
    font-size:10px;
}

/* =====================================================
   RADAR VIEWER
===================================================== */

.radar-viewer{
    display:none;

    position:fixed;

    inset:0;

    z-index:100000;

    overflow:hidden;

    background:#02060b;

    /*
       Браузер не должен сам
       обрабатывать pinch/scroll.
    */

    touch-action:none;

    overscroll-behavior:none;
}

.radar-viewer.open{
    display:block;
}

/*
   Сцена GIF.

   Центр сцены = центр экрана.

   Вся трансформация выполняется
   только через CSS transform.
*/

.radar-stage{

    position:absolute;

    left:50%;
    top:50%;

    width:100vw;
    height:100vh;

    transform-origin:center center;

    display:flex;

    align-items:center;
    justify-content:center;

    will-change:transform;

    touch-action:none;

    user-select:none;
    -webkit-user-select:none;
}

/*
   Сама GIF.

   Никакой видимой точки
   между пальцами здесь нет.
*/

.radar-image{

    display:block;

    width:auto;
    height:auto;

    max-width:none;
    max-height:none;

    /*
       Сохраняем пиксельный вид.
    */

    image-rendering:pixelated;
    image-rendering:crisp-edges;

    user-select:none;
    -webkit-user-select:none;

    -webkit-user-drag:none;

    pointer-events:none;
}

/* =====================================================
   RADAR HEADER
===================================================== */

.radar-header{

    position:absolute;

    z-index:200;

    left:9px;
    right:9px;
    top:9px;

    display:flex;

    align-items:center;
    justify-content:space-between;

    pointer-events:none;
}

.radar-title{

    padding:9px 12px;

    border-radius:12px;

    background:rgba(3,8,14,.94);

    backdrop-filter:blur(12px);

    font-size:13px;
}

.radar-close{

    padding:10px 13px;

    border:none;
    border-radius:11px;

    background:rgba(3,8,14,.95);

    color:white;

    font-weight:650;

    pointer-events:auto;
}

/* =====================================================
   RADAR CONTROLS
===================================================== */

.radar-controls{

    position:absolute;

    z-index:200;

    right:13px;
    top:50%;

    transform:
        translateY(-50%);

    display:flex;

    flex-direction:column;

    gap:8px;

    pointer-events:auto;
}

.radar-control{

    width:53px;
    height:53px;

    border:none;
    border-radius:15px;

    background:rgba(3,8,14,.95);

    color:white;

    font-size:23px;
    font-weight:600;

    box-shadow:
        0 4px 16px
        rgba(0,0,0,.4);

    -webkit-tap-highlight-color:
        transparent;
}

.radar-help{

    position:absolute;

    z-index:200;

    left:50%;
    bottom:10px;

    transform:
        translateX(-50%);

    padding:8px 12px;

    border-radius:10px;

    background:rgba(3,8,14,.82);

    color:#91a3b6;

    font-size:11px;

    white-space:nowrap;

    pointer-events:none;
}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:650px){

    .details{
        grid-template-columns:
            repeat(2,1fr);
    }

    .map-preview{
        height:340px;
    }

    .radar-control{
        width:51px;
        height:51px;
    }

}

</style>
</head>

<body>

<!-- =====================================================
     MAIN
===================================================== -->

<div class="app">

    <header>

        <div class="logo">
            Метео<span>•</span>
        </div>

        <div
            id="locationStatus"
            class="location">

            Город не выбран

        </div>

    </header>


    <div class="search">

        <input
            id="cityInput"
            value="Уфа"
            placeholder="Введите город">

        <button
            onclick="searchCity()">

            ⌕

        </button>

    </div>


    <div
        id="error"
        class="error">
    </div>


    <div id="weather">

        <div style="
            padding:30px;
            text-align:center;
            color:#8496a9;
        ">

            Загрузка...

        </div>

    </div>


    <div class="section-title">

        Карта прогнозов

    </div>


    <div class="map-preview">

        <div id="previewMap"></div>

        <div class="preview-label">

            ICON • Осадки

        </div>

        <button
            class="open-map"
            onclick="openForecastMap()">

            Открыть карту

        </button>

    </div>

</div>


<!-- =====================================================
     FULL MAP
===================================================== -->

<div
    id="fullscreenMap"
    class="fullscreen-map">

    <div id="forecastMap"></div>


    <div class="map-top">

        <div class="map-layers">

            <button
                class="layer active">

                🌧 Осадки

            </button>


            <button
                class="layer"
                onclick="openRadarViewer()">

                📡 Радарная-GIF

            </button>

        </div>


        <button
            class="close-map"
            onclick="closeForecastMap()">

            Закрыть карту

        </button>

    </div>


    <div class="legend">

        <div class="legend-title">

            Осадки, мм/ч

        </div>


        <div class="gradient"></div>


        <div class="legend-values">

            <span>0</span>
            <span>0.2</span>
            <span>1</span>
            <span>7</span>
            <span>15+</span>

        </div>

    </div>

</div>


<!-- =====================================================
     RADAR GIF VIEWER
===================================================== -->

<div
    id="radarViewer"
    class="radar-viewer">


    <div
        id="radarStage"
        class="radar-stage">


        <img
            id="radarImage"
            class="radar-image"
            draggable="false"
            alt="Meteoinfo Radar">


    </div>


    <div class="radar-header">

        <div class="radar-title">

            📡 Meteoinfo • Radar

        </div>


        <button
            class="radar-close"
            onclick="closeRadarViewer()">

            Закрыть

        </button>

    </div>


    <div class="radar-controls">


        <button
            class="radar-control"
            onclick="radarZoom(1.25)">

            +

        </button>


        <button
            class="radar-control"
            onclick="radarZoom(0.8)">

            −

        </button>


        <button
            class="radar-control"
            onclick="radarRotate(-15)">

            ↶

        </button>


        <button
            class="radar-control"
            onclick="radarRotate(15)">

            ↷

        </button>


        <button
            class="radar-control"
            onclick="resetRadar()">

            ⟳

        </button>


    </div>


    <div class="radar-help">

        Два пальца — масштаб + вращение • Один палец — перемещение

    </div>

</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* =====================================================
   MAP VARIABLES
===================================================== */

let latitude = 54.7388;
let longitude = 55.9721;

let previewMap;
let forecastMap;
let marker;


/* =====================================================
   CREATE MAPS
===================================================== */

function createMaps(){

    previewMap =
        L.map(
            "previewMap",
            {
                zoomControl:false,
                attributionControl:false
            }
        )
        .setView(
            [latitude,longitude],
            5
        );


    L.tileLayer(
        "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
        {
            subdomains:"abcd",
            maxZoom:20
        }
    )
    .addTo(previewMap);


    forecastMap =
        L.map(
            "forecastMap",
            {
                zoomControl:true
            }
        )
        .setView(
            [latitude,longitude],
            5
        );


    L.tileLayer(
        "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
        {
            subdomains:"abcd",
            maxZoom:20,
            attribution:
                "© OpenStreetMap © CARTO"
        }
    )
    .addTo(forecastMap);

}


/* =====================================================
   MARKER
===================================================== */

function updateMarker(){

    if(marker){

        forecastMap.removeLayer(marker);

    }


    marker =
        L.circleMarker(
            [latitude,longitude],
            {
                radius:6,

                color:"#fff",

                weight:2,

                fillColor:"#268cff",

                fillOpacity:1
            }
        )
        .addTo(forecastMap);

}


/* =====================================================
   OPEN MAP
===================================================== */

function openForecastMap(){

    document
        .getElementById(
            "fullscreenMap"
        )
        .classList.add("open");


    setTimeout(
        function(){

            forecastMap.invalidateSize();

            forecastMap.setView(
                [latitude,longitude],
                6
            );

            updateMarker();

        },
        100
    );

}


/* =====================================================
   CLOSE MAP
===================================================== */

function closeForecastMap(){

    document
        .getElementById(
            "fullscreenMap"
        )
        .classList.remove("open");

}


/* =====================================================
   RADAR STATE
===================================================== */

const radarViewer =
    document.getElementById(
        "radarViewer"
    );

const radarStage =
    document.getElementById(
        "radarStage"
    );

const radarImage =
    document.getElementById(
        "radarImage"
    );


/*
   Всё состояние GIF находится
   здесь и никогда не сбрасывается
   само по себе.
*/

let radar = {

    x:0,

    y:0,

    scale:1,

    rotation:0

};


/*
   Активные пальцы.
*/

const pointers =
    new Map();


/*
   Состояние текущего жеста.
*/

let gesture = null;


/* =====================================================
   OPEN RADAR
===================================================== */

function openRadarViewer(){

    radarViewer
        .classList
        .add("open");


    loadRadar();


    /*
       ВАЖНО:

       Здесь НЕТ resetRadar().

       Поэтому при повторном открытии
       сохраняются:

       - положение
       - масштаб
       - вращение
    */

    applyRadarTransform();

}


/* =====================================================
   CLOSE RADAR
===================================================== */

function closeRadarViewer(){

    radarViewer
        .classList
        .remove("open");

}


/* =====================================================
   LOAD GIF
===================================================== */

function loadRadar(){

    /*
       Обновляем GIF через cache-busting.

       Трансформация при этом
       НЕ меняется.
    */

    const currentX =
        radar.x;

    const currentY =
        radar.y;

    const currentScale =
        radar.scale;

    const currentRotation =
        radar.rotation;


    radarImage.onload =
        function(){

            radar.x =
                currentX;

            radar.y =
                currentY;

            radar.scale =
                currentScale;

            radar.rotation =
                currentRotation;

            applyRadarTransform();

        };


    radarImage.src =
        "https://meteoinfo.ru/hmc-output/rmap/phenomena.gif?" +
        Date.now();

}


/* =====================================================
   AUTO UPDATE GIF
===================================================== */

setInterval(
    function(){

        if(
            radarViewer.classList.contains(
                "open"
            )
        ){

            loadRadar();

        }

    },
    240000
);


/* =====================================================
   APPLY TRANSFORM
===================================================== */

function applyRadarTransform(){

    /*
       radar.x / radar.y —
       смещение центра GIF.

       rotation —
       вращение.

       scale —
       масштаб.

       Никакой отдельной видимой
       точки здесь нет.
    */

    radarStage.style.transform =

        "translate3d(" +

        "calc(-50% + " +
        radar.x +
        "px), " +

        "calc(-50% + " +
        radar.y +
        "px), 0)" +

        "rotate(" +
        radar.rotation +
        "deg)" +

        "scale(" +
        radar.scale +
        ")";

}


/* =====================================================
   BUTTON ZOOM
===================================================== */

function radarZoom(factor){

    radar.scale *= factor;


    radar.scale =
        Math.max(
            0.1,
            Math.min(
                20,
                radar.scale
            )
        );


    applyRadarTransform();

}


/* =====================================================
   BUTTON ROTATE
===================================================== */

function radarRotate(angle){

    radar.rotation += angle;

    applyRadarTransform();

}


/* =====================================================
   RESET
===================================================== */

function resetRadar(){

    radar.x = 0;

    radar.y = 0;

    radar.scale = 1;

    radar.rotation = 0;

    applyRadarTransform();

}


/* =====================================================
   GESTURE HELPERS
===================================================== */

function getDistance(a,b){

    return Math.hypot(
        b.x - a.x,
        b.y - a.y
    );

}


function getAngle(a,b){

    return Math.atan2(
        b.y - a.y,
        b.x - a.x
    ) * 180 / Math.PI;

}


function getCenter(a,b){

    return {

        x:
            (a.x + b.x) / 2,

        y:
            (a.y + b.y) / 2

    };

}


function normalizeAngle(angle){

    while(angle > 180)
        angle -= 360;

    while(angle < -180)
        angle += 360;

    return angle;

}


/* =====================================================
   POINTER DOWN
===================================================== */

radarViewer.addEventListener(
    "pointerdown",
    function(e){

        /*
           Кнопки не должны
           запускать жест.
        */

        if(
            e.target.closest(
                ".radar-controls"
            ) ||
            e.target.closest(
                ".radar-header"
            )
        ){

            return;

        }


        e.preventDefault();


        pointers.set(
            e.pointerId,
            {
                x:e.clientX,
                y:e.clientY
            }
        );


        /* ---------------------------------------------
           ОДИН ПАЛЕЦ
        --------------------------------------------- */

        if(
            pointers.size === 1
        ){

            const p =
                Array.from(
                    pointers.values()
                )[0];


            gesture = {

                type:"pan",

                startX:p.x,

                startY:p.y,

                startRadarX:
                    radar.x,

                startRadarY:
                    radar.y

            };

        }


        /* ---------------------------------------------
           ДВА ПАЛЬЦА
        --------------------------------------------- */

        if(
            pointers.size === 2
        ){

            const pts =
                Array.from(
                    pointers.values()
                );


            const p1 = pts[0];

            const p2 = pts[1];


            const center =
                getCenter(
                    p1,
                    p2
                );


            const distance =
                getDistance(
                    p1,
                    p2
                );


            const angle =
                getAngle(
                    p1,
                    p2
                );


            /*
               ------------------------------------------------
               САМАЯ ВАЖНАЯ ЧАСТЬ
               ------------------------------------------------

               Берём точку между пальцами
               и переводим её в локальные
               координаты GIF.

               Именно эта точка затем
               остаётся неподвижной
               относительно пальцев.
            */


            const dx =
                center.x -
                (
                    window.innerWidth / 2 +
                    radar.x
                );


            const dy =
                center.y -
                (
                    window.innerHeight / 2 +
                    radar.y
                );


            const rotationRad =
                -radar.rotation *
                Math.PI /
                180;


            const cos =
                Math.cos(
                    rotationRad
                );


            const sin =
                Math.sin(
                    rotationRad
                );


            const localX =
                (
                    dx * cos -
                    dy * sin
                ) /
                radar.scale;


            const localY =
                (
                    dx * sin +
                    dy * cos
                ) /
                radar.scale;


            gesture = {

                type:"transform",


                /*
                   Исходная геометрия
                   двух пальцев.
                */

                startDistance:
                    distance,

                startAngle:
                    angle,


                startCenterX:
                    center.x,

                startCenterY:
                    center.y,


                /*
                   Исходная трансформация.
                */

                startScale:
                    radar.scale,

                startRotation:
                    radar.rotation,


                /*
                   Локальная точка GIF,
                   которая была между
                   пальцами.
                */

                localX:
                    localX,

                localY:
                    localY

            };

        }

    },
    {
        passive:false
    }
);


/* =====================================================
   POINTER MOVE
===================================================== */

radarViewer.addEventListener(
    "pointermove",
    function(e){

        if(
            !pointers.has(
                e.pointerId
            )
        ){

            return;

        }


        e.preventDefault();


        pointers.set(
            e.pointerId,
            {
                x:e.clientX,
                y:e.clientY
            }
        );


        /* =================================================
           ОДИН ПАЛЕЦ
        ================================================= */

        if(
            pointers.size === 1 &&
            gesture &&
            gesture.type === "pan"
        ){

            const p =
                Array.from(
                    pointers.values()
                )[0];


            radar.x =
                gesture.startRadarX +
                (
                    p.x -
                    gesture.startX
                );


            radar.y =
                gesture.startRadarY +
                (
                    p.y -
                    gesture.startY
                );


            applyRadarTransform();

            return;

        }


        /* =================================================
           ДВА ПАЛЬЦА
        ================================================= */

        if(
            pointers.size === 2 &&
            gesture &&
            gesture.type === "transform"
        ){

            const pts =
                Array.from(
                    pointers.values()
                );


            const p1 = pts[0];

            const p2 = pts[1];


            /*
               Новый центр между пальцами.
            */

            const center =
                getCenter(
                    p1,
                    p2
                );


            /*
               Новое расстояние.
            */

            const distance =
                getDistance(
                    p1,
                    p2
                );


            /*
               Новый угол.
            */

            const angle =
                getAngle(
                    p1,
                    p2
                );


            /* =================================================
               НОВЫЙ SCALE
            ================================================= */

            const scaleFactor =
                distance /
                gesture.startDistance;


            radar.scale =
                gesture.startScale *
                scaleFactor;


            radar.scale =
                Math.max(
                    0.1,
                    Math.min(
                        20,
                        radar.scale
                    )
                );


            /* =================================================
               НОВЫЙ ROTATION
            ================================================= */

            const angleDelta =
                normalizeAngle(
                    angle -
                    gesture.startAngle
                );


            radar.rotation =
                gesture.startRotation +
                angleDelta;


            /* =================================================
               ФИКСИРОВАННАЯ ТОЧКА
            ================================================= */

            /*
               Пересчитываем положение
               локальной точки GIF после
               нового масштаба и вращения.
            */

            const rotationRad =
                radar.rotation *
                Math.PI /
                180;


            const cos =
                Math.cos(
                    rotationRad
                );


            const sin =
                Math.sin(
                    rotationRad
                );


            const rotatedX =
                (
                    gesture.localX *
                    radar.scale *
                    cos
                )
                -
                (
                    gesture.localY *
                    radar.scale *
                    sin
                );


            const rotatedY =
                (
                    gesture.localX *
                    radar.scale *
                    sin
                )
                +
                (
                    gesture.localY *
                    radar.scale *
                    cos
                );


            /*
               Ставим центр GIF так,
               чтобы сохранённая локальная
               точка находилась точно
               под новой точкой между
               пальцами.
            */

            radar.x =
                center.x -
                (
                    window.innerWidth / 2
                ) -
                rotatedX;


            radar.y =
                center.y -
                (
                    window.innerHeight / 2
                ) -
                rotatedY;


            applyRadarTransform();

        }

    },
    {
        passive:false
    }
);


/* =====================================================
   POINTER UP
===================================================== */

function finishPointer(e){

    /*
       Удаляем только отпущенный палец.
    */

    pointers.delete(
        e.pointerId
    );


    /*
       НИЧЕГО НЕ СБРАСЫВАЕМ.

       Масштаб остаётся.
       Угол остаётся.
       Положение остаётся.
    */

    if(
        pointers.size === 0
    ){

        gesture = null;

        return;

    }


    /*
       Если один палец остался после
       двухпальцевого жеста, начинаем
       новый pan от текущей позиции.

       Поэтому GIF не скачет.
    */

    if(
        pointers.size === 1
    ){

        const p =
            Array.from(
                pointers.values()
            )[0];


        gesture = {

            type:"pan",

            startX:
                p.x,

            startY:
                p.y,

            startRadarX:
                radar.x,

            startRadarY:
                radar.y

        };

    }

}


radarViewer.addEventListener(
    "pointerup",
    finishPointer,
    {
        passive:false
    }
);


radarViewer.addEventListener(
    "pointercancel",
    finishPointer,
    {
        passive:false
    }
);


/* =====================================================
   WEATHER
===================================================== */

const weatherCodes = {

    0:["☀️","Ясно"],

    1:["🌤️","Преимущественно ясно"],

    2:["⛅","Переменная облачность"],

    3:["☁️","Пасмурно"],

    45:["🌫️","Туман"],

    48:["🌫️","Изморозь"],

    51:["🌦️","Морось"],

    53:["🌦️","Морось"],

    55:["🌧️","Сильная морось"],

    61:["🌧️","Небольшой дождь"],

    63:["🌧️","Дождь"],

    65:["🌧️","Сильный дождь"],

    71:["🌨️","Небольшой снег"],

    73:["🌨️","Снег"],

    75:["❄️","Сильный снег"],

    80:["🌦️","Ливень"],

    81:["🌧️","Сильный ливень"],

    82:["⛈️","Очень сильный ливень"],

    85:["🌨️","Снегопад"],

    86:["❄️","Сильный снегопад"],

    95:["⛈️","Гроза"],

    96:["⛈️","Гроза с градом"],

    99:["⛈️","Сильная гроза с градом"]

};


function getWeather(code){

    return (
        weatherCodes[code] ||
        ["🌡️","Неизвестно"]
    );

}


function getWindDirection(deg){

    const directions = [
        "С",
        "СВ",
        "В",
        "ЮВ",
        "Ю",
        "ЮЗ",
        "З",
        "СЗ"
    ];


    return directions[
        Math.round(
            deg / 45
        ) % 8
    ];

}


/* =====================================================
   SEARCH CITY
===================================================== */

async function searchCity(){

    const input =
        document.getElementById(
            "cityInput"
        );


    const city =
        input.value.trim();


    if(!city)
        return;


    document
        .getElementById("error")
        .style.display =
            "none";


    document
        .getElementById("weather")
        .innerHTML = `

            <div style="
                padding:30px;
                text-align:center;
                color:#8496a9;
            ">

                Загрузка прогноза...

            </div>

        `;


    try{

        const response =
            await fetch(
                "https://geocoding-api.open-meteo.com/v1/search" +
                "?name=" +
                encodeURIComponent(city) +
                "&count=1" +
                "&language=ru" +
                "&format=json"
            );


        const data =
            await response.json();


        if(
            !data.results ||
            !data.results.length
        ){

            throw new Error(
                "Город не найден"
            );

        }


        const place =
            data.results[0];


        latitude =
            place.latitude;

        longitude =
            place.longitude;


        document
            .getElementById(
                "locationStatus"
            )
            .textContent =
                place.name;


        previewMap.setView(
            [
                latitude,
                longitude
            ],
            6
        );


        forecastMap.setView(
            [
                latitude,
                longitude
            ],
            6
        );


        updateMarker();


        await loadWeather(
            place.name
        );

    }
    catch(error){

        document
            .getElementById(
                "locationStatus"
            )
            .textContent =
                "Город не выбран";


        document
            .getElementById(
                "error"
            )
            .textContent =
                "Не удалось найти город";


        document
            .getElementById(
                "error"
            )
            .style.display =
                "block";

    }

}


/* =====================================================
   WEATHER API
===================================================== */

async function loadWeather(city){

    const url =
        "https://api.open-meteo.com/v1/dwd-icon" +

        "?latitude=" +
        latitude +

        "&longitude=" +
        longitude +

        "&current=" +

        "temperature_2m," +
        "relative_humidity_2m," +
        "apparent_temperature," +
        "precipitation," +
        "weather_code," +
        "pressure_msl," +
        "wind_speed_10m," +
        "wind_direction_10m" +

        "&daily=" +

        "weather_code," +
        "temperature_2m_max," +
        "temperature_2m_min," +
        "precipitation_probability_max" +

        "&forecast_days=7" +

        "&timezone=auto";


    try{

        const response =
            await fetch(url);


        if(!response.ok)
            throw new Error();


        const data =
            await response.json();


        renderWeather(
            data,
            city
        );

    }
    catch(e){

        document
            .getElementById(
                "error"
            )
            .textContent =
                "Прогноз временно недоступен";


        document
            .getElementById(
                "error"
            )
            .style.display =
                "block";

    }

}


/* =====================================================
   RENDER WEATHER
===================================================== */

function renderWeather(
    data,
    city
){

    const c =
        data.current;

    const d =
        data.daily;


    const w =
        getWeather(
            c.weather_code
        );


    let html = `

        <div class="current">

            <div class="current-top">

                <div>

                    <div class="city">

                        ${city}

                    </div>

                    <div class="date">

                        ${new Date()
                            .toLocaleDateString(
                                "ru-RU",
                                {
                                    weekday:"long",
                                    day:"numeric",
                                    month:"long"
                                }
                            )}

                    </div>

                </div>


                <div class="weather-icon">

                    ${w[0]}

                </div>

            </div>


            <div class="temperature">

                ${Math.round(
                    c.temperature_2m
                )}°

            </div>


            <div class="description">

                ${w[1]}

            </div>


            <div class="details">


                <div class="detail">

                    <div class="detail-title">
                        Ощущается
                    </div>

                    <div class="detail-value">

                        ${Math.round(
                            c.apparent_temperature
                        )}°

                    </div>

                </div>


                <div class="detail">

                    <div class="detail-title">
                        Влажность
                    </div>

                    <div class="detail-value">

                        ${c.relative_humidity_2m}%

                    </div>

                </div>


                <div class="detail">

                    <div class="detail-title">
                        Ветер
                    </div>

                    <div class="detail-value">

                        ${Math.round(
                            c.wind_speed_10m
                        )} км/ч

                    </div>

                </div>


                <div class="detail">

                    <div class="detail-title">
                        Направление
                    </div>

                    <div class="detail-value">

                        ${getWindDirection(
                            c.wind_direction_10m
                        )}

                        ${Math.round(
                            c.wind_direction_10m
                        )}°

                    </div>

                </div>


                <div class="detail">

                    <div class="detail-title">
                        Давление
                    </div>

                    <div class="detail-value">

                        ${Math.round(
                            c.pressure_msl
                        )} hPa

                    </div>

                </div>


                <div class="detail">

                    <div class="detail-title">
                        Осадки
                    </div>

                    <div class="detail-value">

                        ${c.precipitation} мм

                    </div>

                </div>


                <div class="detail">

                    <div class="detail-title">
                        Максимум
                    </div>

                    <div class="detail-value">

                        ${Math.round(
                            d.temperature_2m_max[0]
                        )}°

                    </div>

                </div>


                <div class="detail">

                    <div class="detail-title">
                        Вероятность осадков
                    </div>

                    <div class="detail-value">

                        ${d.precipitation_probability_max[0]}%

                    </div>

                </div>


            </div>

        </div>


        <div class="section-title">

            Прогноз на 7 дней

        </div>


        <div class="forecast">

    `;


    for(
        let i=0;
        i<7;
        i++
    ){

        const date =
            new Date(
                d.time[i] +
                "T12:00:00"
            );


        const dw =
            getWeather(
                d.weather_code[i]
            );


        const name =
            i === 0
            ? "Сегодня"
            : date.toLocaleDateString(
                "ru-RU",
                {
                    weekday:"short"
                }
            );


        html += `

            <div class="day">

                <div class="day-name">

                    ${name}

                </div>


                <div class="day-icon">

                    ${dw[0]}

                </div>


                <div class="day-temp">

                    ${Math.round(
                        d.temperature_2m_max[i]
                    )}°

                    /

                    ${Math.round(
                        d.temperature_2m_min[i]
                    )}°

                </div>


                <div class="day-rain">

                    💧
                    ${d.precipitation_probability_max[i]}%

                </div>

            </div>

        `;

    }


    html += `

        </div>

    `;


    document
        .getElementById(
            "weather"
        )
        .innerHTML =
            html;

}

    )

            if(

createMaps();

searchCity();
