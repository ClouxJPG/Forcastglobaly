<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no">

<title>Метео</title>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    min-height:100%;
    background:#050a10;
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

body{
    overflow-x:hidden;
}

button,input{
    font-family:inherit;
}

.app{
    max-width:1100px;
    margin:auto;
    padding:14px;
}

header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
}

.logo{
    font-size:26px;
    font-weight:800;
}

.logo span{
    color:#268cff;
}

.location{
    color:#8496a9;
    font-size:13px;
}

.search{
    display:flex;
    gap:8px;
    margin-bottom:14px;
}

.search input{
    flex:1;
    height:50px;
    padding:0 15px;
    border:none;
    outline:none;
    border-radius:15px;
    background:#101a26;
    color:#fff;
    font-size:16px;
}

.search button{
    width:52px;
    height:50px;
    border:none;
    border-radius:15px;
    background:#268cff;
    color:#fff;
    font-size:23px;
}

.error{
    display:none;
    padding:12px;
    margin-bottom:12px;
    border-radius:13px;
    background:#35151c;
    color:#ff9ca8;
}

.current{
    padding:22px;
    border-radius:24px;
    background:linear-gradient(145deg,#122e4b,#09131e);
}

.current-top{
    display:flex;
    justify-content:space-between;
}

.city{
    font-size:27px;
    font-weight:750;
}

.date{
    margin-top:5px;
    color:#899aaa;
    font-size:13px;
}

.weather-icon{
    font-size:50px;
}

.temperature{
    margin-top:13px;
    font-size:68px;
    line-height:1;
    font-weight:750;
}

.description{
    margin-top:8px;
    color:#c6d0da;
    font-size:18px;
}

.details{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:9px;
    margin-top:23px;
}

.detail{
    padding:12px;
    border-radius:14px;
    background:rgba(255,255,255,.05);
}

.detail-title{
    margin-bottom:5px;
    color:#7f91a5;
    font-size:11px;
}

.detail-value{
    font-size:14px;
    font-weight:650;
}

.section-title{
    margin:23px 0 10px;
    font-size:20px;
    font-weight:750;
}

.forecast{
    display:flex;
    gap:9px;
    overflow-x:auto;
}

.forecast::-webkit-scrollbar{
    display:none;
}

.day{
    min-width:115px;
    padding:14px;
    text-align:center;
    border-radius:17px;
    background:#101a27;
}

.day-name{
    color:#94a5b7;
    font-size:13px;
}

.day-icon{
    margin:9px 0;
    font-size:32px;
}

.day-temp{
    font-weight:650;
}

.day-rain{
    margin-top:6px;
    color:#62aaff;
    font-size:12px;
}

.map-preview{
    position:relative;
    height:390px;
    overflow:hidden;
    border-radius:22px;
    background:#060b12;
}

#previewMap{
    width:100%;
    height:100%;
}

.preview-label{
    position:absolute;
    z-index:1000;
    left:10px;
    top:10px;
    padding:7px 10px;
    border-radius:9px;
    background:rgba(4,9,15,.9);
    font-size:12px;
}

.open-map{
    position:absolute;
    z-index:1000;
    right:10px;
    bottom:10px;
    padding:13px 17px;
    border:none;
    border-radius:13px;
    background:rgba(4,9,15,.96);
    color:#fff;
    font-size:14px;
    font-weight:650;
}

.fullscreen-map{
    display:none;
    position:fixed;
    inset:0;
    z-index:50000;
    background:#050a10;
}

.fullscreen-map.open{
    display:block;
}

#forecastMap{
    position:absolute;
    inset:0;
}

.map-top{
    position:absolute;
    z-index:10000;
    top:8px;
    left:8px;
    right:8px;
    display:flex;
    justify-content:space-between;
    gap:8px;
    pointer-events:none;
}

.map-layers{
    display:flex;
    gap:5px;
    max-width:calc(100% - 105px);
    overflow-x:auto;
    padding:5px;
    border-radius:13px;
    background:rgba(4,9,15,.94);
    pointer-events:auto;
}

.map-layers::-webkit-scrollbar{
    display:none;
}

.layer{
    flex-shrink:0;
    padding:9px 12px;
    border:none;
    border-radius:9px;
    background:#111d2b;
    color:#aab9c9;
}

.layer.active{
    background:#268cff;
    color:#fff;
}

.close-map{
    padding:10px 12px;
    border:none;
    border-radius:11px;
    background:rgba(4,9,15,.95);
    color:#fff;
    pointer-events:auto;
}

.radar-status{
    position:absolute;
    z-index:10001;
    top:62px;
    left:10px;
    padding:7px 10px;
    border-radius:9px;
    background:rgba(4,9,15,.9);
    color:#aebdca;
    font-size:11px;
    pointer-events:none;
}

.legend{
    position:absolute;
    z-index:10000;
    left:10px;
    bottom:10px;
    padding:12px;
    border-radius:13px;
    background:rgba(4,9,15,.94);
}

.legend-title{
    margin-bottom:7px;
    font-size:12px;
}

.gradient{
    width:220px;
    height:10px;
    border-radius:10px;
    background:linear-gradient(
        90deg,
        #5e9cff,
        #315be7,
        #6125d5,
        #b522ae,
        #ed2450,
        #ff8a00
    );
}

.legend-values{
    display:flex;
    justify-content:space-between;
    margin-top:4px;
    color:#8293a5;
    font-size:10px;
}

/* =========================
   GIF VIEWER
========================= */

.radar-viewer{
    display:none;
    position:fixed;
    inset:0;
    z-index:100000;
    overflow:hidden;
    background:#02060b;
    touch-action:none;
    overscroll-behavior:none;
}

.radar-viewer.open{
    display:block;
}

.radar-stage{
    position:absolute;
    left:50%;
    top:50%;
    width:100vw;
    height:100vh;
    transform-origin:center center;
    display:flex;
    align-items:center;
    justify-content:center;
    will-change:transform;
    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
}

.radar-image{
    display:block;
    width:auto;
    height:auto;
    max-width:none;
    max-height:none;
    image-rendering:pixelated;
    image-rendering:crisp-edges;
    user-select:none;
    -webkit-user-select:none;
    -webkit-user-drag:none;
    pointer-events:none;
}

.radar-header{
    position:absolute;
    z-index:200;
    left:9px;
    right:9px;
    top:9px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    pointer-events:none;
}

.radar-title{
    padding:9px 12px;
    border-radius:12px;
    background:rgba(3,8,14,.94);
    backdrop-filter:blur(12px);
    font-size:13px;
}

.radar-close{
    padding:10px 13px;
    border:none;
    border-radius:11px;
    background:rgba(3,8,14,.95);
    color:#fff;
    font-weight:650;
    pointer-events:auto;
}

.radar-controls{
    position:absolute;
    z-index:200;
    right:13px;
    top:50%;
    transform:translateY(-50%);
    display:flex;
    flex-direction:column;
    gap:8px;
    pointer-events:auto;
}

.radar-control{
    width:53px;
    height:53px;
    border:none;
    border-radius:15px;
    background:rgba(3,8,14,.95);
    color:#fff;
    font-size:23px;
    font-weight:600;
    box-shadow:0 4px 16px rgba(0,0,0,.4);
    -webkit-tap-highlight-color:transparent;
}

.radar-help{
    position:absolute;
    z-index:200;
    left:50%;
    bottom:10px;
    transform:translateX(-50%);
    padding:8px 12px;
    border-radius:10px;
    background:rgba(3,8,14,.82);
    color:#91a3b6;
    font-size:11px;
    white-space:nowrap;
    pointer-events:none;
}

@media(max-width:650px){

    .details{
        grid-template-columns:repeat(2,1fr);
    }

    .map-preview{
        height:340px;
    }

    .radar-control{
        width:51px;
        height:51px;
    }

    .legend{
        transform:scale(.9);
        transform-origin:left bottom;
    }
}
</style>
</head>

<body>

<div class="app">

<header>
    <div class="logo">
        Метео<span>•</span>
    </div>

    <div id="locationStatus" class="location">
        Город не выбран
    </div>
</header>

<div class="search">

    <input
        id="cityInput"
        value="Уфа"
        placeholder="Введите город">

    <button onclick="searchCity()">
        ⌕
    </button>

</div>

<div id="error" class="error"></div>

<div id="weather">

    <div style="
        padding:30px;
        text-align:center;
        color:#8496a9;
    ">
        Загрузка...
    </div>

</div>

<div class="section-title">
    Карта прогнозов
</div>

<div class="map-preview">

    <div id="previewMap"></div>

    <div class="preview-label">
        OPERA / LibreWXR
    </div>

    <button
        class="open-map"
        onclick="openForecastMap()">

        Открыть карту

    </button>

</div>

</div>


<!-- =========================
     FULL MAP
========================= -->

<div
    id="fullscreenMap"
    class="fullscreen-map">

    <div id="forecastMap"></div>

    <div class="map-top">

        <div class="map-layers">

            <button
                id="operaLayerButton"
                class="layer active"
                onclick="showOperaLayer()">

                🌧 Осадки • OPERA / LibreWXR

            </button>

            <button
                class="layer"
                onclick="openRadarViewer()">

                📡 Радарная-GIF

            </button>

        </div>

        <button
            class="close-map"
            onclick="closeForecastMap()">

            Закрыть

        </button>

    </div>

    <div
        id="radarStatus"
        class="radar-status">

        Карта готова

    </div>

    <div class="legend">

        <div class="legend-title">
            Интенсивность осадков
        </div>

        <div class="gradient"></div>

        <div class="legend-values">
            <span>слабо</span>
            <span>умеренно</span>
            <span>сильно</span>
            <span>очень сильно</span>
        </div>

    </div>

</div>


<!-- =========================
     GIF VIEWER
     НЕ ТРОГАЛ
========================= -->

<div
    id="radarViewer"
    class="radar-viewer">

    <div
        id="radarStage"
        class="radar-stage">

        <img
            id="radarImage"
            class="radar-image"
            draggable="false"
            alt="Meteoinfo Radar">

    </div>

    <div class="radar-header">

        <div class="radar-title">
            📡 Meteoinfo • Radar
        </div>

        <button
            class="radar-close"
            onclick="closeRadarViewer()">

            Закрыть

        </button>

    </div>

    <div class="radar-controls">

        <button
            class="radar-control"
            onclick="radarZoom(1.25)">
            +
        </button>

        <button
            class="radar-control"
            onclick="radarZoom(.8)">
            −
        </button>

        <button
            class="radar-control"
            onclick="radarRotate(-15)">
            ↶
        </button>

        <button
            class="radar-control"
            onclick="radarRotate(15)">
            ↷
        </button>

        <button
            class="radar-control"
            onclick="resetRadar()">
            ⟳
        </button>

    </div>

    <div class="radar-help">
        Два пальца — масштаб + вращение • Один палец — перемещение
    </div>

</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* =====================================================
   GLOBAL
===================================================== */

let latitude = 54.7388;
let longitude = 55.9721;

let previewMap;
let forecastMap;
let marker;

let libreRadarLayer = null;
let libreRadarTimestamp = null;

const LIBRE_API =
    "https://api.librewxr.net";

const LIBRE_METADATA =
    LIBRE_API +
    "/public/weather-maps.json";


/* =====================================================
   FAST CACHE
===================================================== */

const CACHE_KEY =
    "librewxr_last_timestamp";

const CACHE_TIME_KEY =
    "librewxr_timestamp_time";

const CACHE_MAX_AGE =
    10 * 60 * 1000;


/*
    Берём сохранённый timestamp.

    Это позволяет сразу создать
    слой, не ожидая metadata.
*/

function getCachedTimestamp(){

    try{

        const timestamp =
            Number(
                localStorage.getItem(
                    CACHE_KEY
                )
            );

        const savedAt =
            Number(
                localStorage.getItem(
                    CACHE_TIME_KEY
                )
            );

        if(
            timestamp &&
            savedAt &&
            Date.now() - savedAt <
            CACHE_MAX_AGE
        ){

            return timestamp;

        }

    }
    catch(e){}

    return null;
}


function cacheTimestamp(timestamp){

    try{

        localStorage.setItem(
            CACHE_KEY,
            String(timestamp)
        );

        localStorage.setItem(
            CACHE_TIME_KEY,
            String(Date.now())
        );

    }
    catch(e){}

}


/* =====================================================
   MAPS
===================================================== */

function createMaps(){

    previewMap =
        L.map(
            "previewMap",
            {
                zoomControl:false,
                attributionControl:false,
                preferCanvas:true
            }
        )
        .setView(
            [latitude,longitude],
            5
        );


    L.tileLayer(
        "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
        {
            subdomains:"abcd",
            maxZoom:20,
            updateWhenIdle:true,
            keepBuffer:1
        }
    ).addTo(previewMap);


    forecastMap =
        L.map(
            "forecastMap",
            {
                zoomControl:true,
                preferCanvas:true,
                zoomAnimation:false,
                fadeAnimation:false,
                markerZoomAnimation:false
            }
        )
        .setView(
            [latitude,longitude],
            5
        );


    L.tileLayer(
        "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
        {
            subdomains:"abcd",
            maxZoom:20,
            updateWhenIdle:true,
            keepBuffer:1,
            attribution:
                "© OpenStreetMap © CARTO"
        }
    ).addTo(forecastMap);

}


/* =====================================================
   MARKER
===================================================== */

function updateMarker(){

    if(marker){

        forecastMap.removeLayer(marker);

    }

    marker =
        L.circleMarker(
            [latitude,longitude],
            {
                radius:6,
                color:"#fff",
                weight:2,
                fillColor:"#268cff",
                fillOpacity:1
            }
        ).addTo(forecastMap);

}


/* =====================================================
   OPEN MAP
===================================================== */

function openForecastMap(){

    document
        .getElementById("fullscreenMap")
        .classList.add("open");


    /*
        ВАЖНО:

        Сначала показываем карту.

        Не ждём API.
    */

    setTimeout(function(){

        forecastMap.invalidateSize(false);

        forecastMap.setView(
            [latitude,longitude],
            6,
            {
                animate:false
            }
        );

        updateMarker();

        /*
            Сначала мгновенно пробуем
            использовать кэшированный
            timestamp.
        */

        const cached =
            getCachedTimestamp();


        if(cached){

            createLibreLayer(
                cached,
                true
            );

        }


        /*
            Metadata загружается
            уже после отображения карты.
        */

        refreshLibreWXR();

    },80);

}


/* =====================================================
   CLOSE MAP
===================================================== */

function closeForecastMap(){

    document
        .getElementById("fullscreenMap")
        .classList.remove("open");

}


/* =====================================================
   METADATA
===================================================== */

async function getLibreTimestamp(){

    const controller =
        new AbortController();

    const timeout =
        setTimeout(
            () => controller.abort(),
            7000
        );


    try{

        const response =
            await fetch(
                LIBRE_METADATA +
                "?t=" +
                Date.now(),
                {
                    method:"GET",
                    cache:"no-store",
                    signal:controller.signal
                }
            );


        if(!response.ok){

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        let frames = [];


        if(
            data.radar &&
            Array.isArray(
                data.radar.past
            )
        ){

            frames =
                data.radar.past;

        }
        else if(
            data.radar &&
            Array.isArray(
                data.radar.frames
            )
        ){

            frames =
                data.radar.frames;

        }
        else if(
            Array.isArray(
                data.radar
            )
        ){

            frames =
                data.radar;

        }


        const timestamps =
            frames
            .map(function(frame){

                if(
                    typeof frame === "number"
                ){

                    return frame;

                }

                return (
                    frame.time ??
                    frame.timestamp ??
                    frame.ts
                );

            })
            .map(Number)
            .filter(
                Number.isFinite
            );


        if(!timestamps.length){

            throw new Error(
                "Timestamp not found"
            );

        }


        return Math.max(
            ...timestamps
        );

    }
    finally{

        clearTimeout(timeout);

    }

}


/* =====================================================
   CREATE LIBREWXR LAYER
===================================================== */

function createLibreLayer(
    timestamp,
    fromCache=false
){

    if(!timestamp)
        return;


    /*
        Не пересоздаём слой,
        если это тот же кадр.
    */

    if(
        libreRadarLayer &&
        libreRadarTimestamp === timestamp
    ){

        if(
            !forecastMap.hasLayer(
                libreRadarLayer
            )
        ){

            libreRadarLayer.addTo(
                forecastMap
            );

        }

        return;

    }


    if(libreRadarLayer){

        forecastMap.removeLayer(
            libreRadarLayer
        );

        libreRadarLayer = null;

    }


    libreRadarTimestamp =
        timestamp;


    /*
        LibreWXR RainViewer-compatible
        radar tile endpoint.

        Используем 256px:
        для мобильного сайта это
        обычно быстрее, чем 512px.

        maxNativeZoom ограничивает
        лишние запросы.
    */

    const tileURL =
        LIBRE_API +
        "/v2/radar/" +
        timestamp +
        "/256/{z}/{x}/{y}/10/1_1.png";


    libreRadarLayer =
        L.tileLayer(
            tileURL,
            {
                tileSize:256,

                opacity:.88,

                maxZoom:18,

                maxNativeZoom:12,

                updateWhenIdle:true,

                updateWhenZooming:false,

                keepBuffer:1,

                crossOrigin:true,

                zIndex:500,

                attribution:
                    "Radar: LibreWXR / EUMETNET OPERA"
            }
        );


    libreRadarLayer.addTo(
        forecastMap
    );


    const status =
        document.getElementById(
            "radarStatus"
        );


    if(fromCache){

        status.textContent =
            "OPERA / LibreWXR • кэшированный кадр";

    }
    else{

        const date =
            new Date(
                timestamp * 1000
            );


        status.textContent =
            "OPERA / LibreWXR • " +
            date.toLocaleTimeString(
                "ru-RU",
                {
                    hour:"2-digit",
                    minute:"2-digit"
                }
            );

    }

}


/* =====================================================
   BACKGROUND REFRESH
===================================================== */

async function refreshLibreWXR(){

    try{

        const timestamp =
            await getLibreTimestamp();


        if(!timestamp)
            return;


        cacheTimestamp(
            timestamp
        );


        /*
            Если это новый кадр —
            меняем слой.

            Если старый —
            вообще ничего не делаем.
        */

        if(
            timestamp !==
            libreRadarTimestamp
        ){

            createLibreLayer(
                timestamp,
                false
            );

        }
        else{

            const status =
                document.getElementById(
                    "radarStatus"
                );


            const date =
                new Date(
                    timestamp * 1000
                );


            status.textContent =
                "OPERA / LibreWXR • " +
                date.toLocaleTimeString(
                    "ru-RU",
                    {
                        hour:"2-digit",
                        minute:"2-digit"
                    }
                );

        }

    }
    catch(error){

        console.warn(
            "LibreWXR:",
            error
        );


        /*
            Если кэшированный слой
            уже есть — НЕ убираем его.
        */

        if(
            libreRadarLayer
        ){

            document
                .getElementById(
                    "radarStatus"
                )
                .textContent =
                    "OPERA / LibreWXR • используется последний кадр";

        }
        else{

            document
                .getElementById(
                    "radarStatus"
                )
                .textContent =
                    "Ожидание данных LibreWXR...";

        }

    }

}


/* =====================================================
   AUTO UPDATE
===================================================== */

setInterval(
    function(){

        const map =
            document.getElementById(
                "fullscreenMap"
            );


        if(
            map.classList.contains(
                "open"
            )
        ){

            /*
                Проверяем новый кадр
                в фоне.

                Карта при этом
                продолжает работать.
            */

            refreshLibreWXR();

        }

    },
    5 * 60 * 1000
);


/* =====================================================
   OPERA BUTTON
===================================================== */

function showOperaLayer(){

    if(!libreRadarLayer){

        const cached =
            getCachedTimestamp();


        if(cached){

            createLibreLayer(
                cached,
                true
            );

        }


        refreshLibreWXR();

        return;

    }


    if(
        !forecastMap.hasLayer(
            libreRadarLayer
        )
    ){

        libreRadarLayer.addTo(
            forecastMap
        );

    }

}


/* =====================================================
   GIF VIEWER
   НИЖЕ ОСТАВЛЕНО БЕЗ ИЗМЕНЕНИЙ
===================================================== */

const radarViewer =
    document.getElementById(
        "radarViewer"
    );

const radarStage =
    document.getElementById(
        "radarStage"
    );

const radarImage =
    document.getElementById(
        "radarImage"
    );

let radar = {

    x:0,
    y:0,
    scale:1,
    rotation:0

};

const pointers =
    new Map();

let gesture = null;


function openRadarViewer(){

    radarViewer
        .classList
        .add("open");

    loadRadarGIF();

    applyRadarTransform();

}


function closeRadarViewer(){

    radarViewer
        .classList
        .remove("open");

}


function loadRadarGIF(){

    const x =
        radar.x;

    const y =
        radar.y;

    const scale =
        radar.scale;

    const rotation =
        radar.rotation;


    radarImage.onload =
        function(){

            radar.x = x;
            radar.y = y;
            radar.scale = scale;
            radar.rotation = rotation;

            applyRadarTransform();

        };


    radarImage.src =
        "https://meteoinfo.ru/hmc-output/rmap/phenomena.gif?" +
        Date.now();

}


setInterval(
    function(){

        if(
            radarViewer
                .classList
                .contains("open")
        ){

            loadRadarGIF();

        }

    },
    240000
);


function applyRadarTransform(){

    radarStage.style.transform =
        "translate3d(" +
        "calc(-50% + " +
        radar.x +
        "px), " +
        "calc(-50% + " +
        radar.y +
        "px), 0)" +
        "rotate(" +
        radar.rotation +
        "deg)" +
        "scale(" +
        radar.scale +
        ")";

}


function radarZoom(factor){

    radar.scale *= factor;

    radar.scale =
        Math.max(
            .1,
            Math.min(
                20,
                radar.scale
            )
        );

    applyRadarTransform();

}


function radarRotate(angle){

    radar.rotation += angle;

    applyRadarTransform();

}


function resetRadar(){

    radar.x = 0;
    radar.y = 0;
    radar.scale = 1;
    radar.rotation = 0;

    applyRadarTransform();

}


function getDistance(a,b){

    return Math.hypot(
        b.x-a.x,
        b.y-a.y
    );

}


function getAngle(a,b){

    return Math.atan2(
        b.y-a.y,
        b.x-a.x
    ) * 180 / Math.PI;

}


function getCenter(a,b){

    return {
        x:(a.x+b.x)/2,
        y:(a.y+b.y)/2
    };

}


function normalizeAngle(angle){

    while(angle > 180)
        angle -= 360;

    while(angle < -180)
        angle += 360;

    return angle;

}


radarViewer.addEventListener(
    "pointerdown",
    function(e){

        if(
            e.target.closest(".radar-controls") ||
            e.target.closest(".radar-header")
        ){
            return;
        }

        e.preventDefault();

        pointers.set(
            e.pointerId,
            {
                x:e.clientX,
                y:e.clientY
            }
        );


        if(
            pointers.size === 1
        ){

            const p =
                Array.from(
                    pointers.values()
                )[0];


            gesture = {

                type:"pan",

                startX:p.x,
                startY:p.y,

                startRadarX:
                    radar.x,

                startRadarY:
                    radar.y

            };

        }


        if(
            pointers.size === 2
        ){

            const pts =
                Array.from(
                    pointers.values()
                );

            const p1 = pts[0];
            const p2 = pts[1];

            const center =
                getCenter(
                    p1,
                    p2
                );

            const distance =
                getDistance(
                    p1,
                    p2
                );

            const angle =
                getAngle(
                    p1,
                    p2
                );


            const dx =
                center.x -
                (
                    window.innerWidth/2 +
                    radar.x
                );

            const dy =
                center.y -
                (
                    window.innerHeight/2 +
                    radar.y
                );


            const rotationRad =
                -radar.rotation *
                Math.PI /
                180;


            const cos =
                Math.cos(
                    rotationRad
                );

            const sin =
                Math.sin(
                    rotationRad
                );


            const localX =
                (
                    dx*cos -
                    dy*sin
                ) /
                radar.scale;


            const localY =
                (
                    dx*sin +
                    dy*cos
                ) /
                radar.scale;


            gesture = {

                type:"transform",

                startDistance:
                    distance,

                startAngle:
                    angle,

                startScale:
                    radar.scale,

                startRotation:
                    radar.rotation,

                localX:localX,
                localY:localY

            };

        }

    },
    {
        passive:false
    }
);


radarViewer.addEventListener(
    "pointermove",
    function(e){

        if(
            !pointers.has(
                e.pointerId
            )
        ){
            return;
        }

        e.preventDefault();


        pointers.set(
            e.pointerId,
            {
                x:e.clientX,
                y:e.clientY
            }
        );


        if(
            pointers.size === 1 &&
            gesture &&
            gesture.type === "pan"
        ){

            const p =
                Array.from(
                    pointers.values()
                )[0];


            radar.x =
                gesture.startRadarX +
                (
                    p.x -
                    gesture.startX
                );


            radar.y =
                gesture.startRadarY +
                (
                    p.y -
                    gesture.startY
                );


            applyRadarTransform();

            return;

        }


        if(
            pointers.size === 2 &&
            gesture &&
            gesture.type === "transform"
        ){

            const pts =
                Array.from(
                    pointers.values()
                );

            const p1 = pts[0];
            const p2 = pts[1];


            const center =
                getCenter(
                    p1,
                    p2
                );


            const distance =
                getDistance(
                    p1,
                    p2
                );


            const angle =
                getAngle(
                    p1,
                    p2
                );


            const factor =
                distance /
                gesture.startDistance;


            radar.scale =
                gesture.startScale *
                factor;


            radar.scale =
                Math.max(
                    .1,
                    Math.min(
                        20,
                        radar.scale
                    )
                );


            radar.rotation =
                gesture.startRotation +
                normalizeAngle(
                    angle -
                    gesture.startAngle
                );


            const rotationRad =
                radar.rotation *
                Math.PI /
                180;


            const cos =
                Math.cos(
                    rotationRad
                );

            const sin =
                Math.sin(
                    rotationRad
                );


            const rotatedX =
                gesture.localX *
                radar.scale *
                cos
                -
                gesture.localY *
                radar.scale *
                sin;


            const rotatedY =
                gesture.localX *
                radar.scale *
                sin
                +
                gesture.localY *
                radar.scale *
                cos;


            radar.x =
                center.x -
                window.innerWidth/2 -
                rotatedX;


            radar.y =
                center.y -
                window.innerHeight/2 -
                rotatedY;


            applyRadarTransform();

        }

    },
    {
        passive:false
    }
);


function finishPointer(e){

    pointers.delete(
        e.pointerId
    );


    if(
        pointers.size === 0
    ){

        gesture = null;

        return;

    }


    if(
        pointers.size === 1
    ){

        const p =
            Array.from(
                pointers.values()
            )[0];


        gesture = {

            type:"pan",

            startX:p.x,
            startY:p.y,

            startRadarX:
                radar.x,

            startRadarY:
                radar.y

        };

    }

}


radarViewer.addEventListener(
    "pointerup",
    finishPointer,
    {
        passive:false
    }
);

radarViewer.addEventListener(
    "pointercancel",
    finishPointer,
    {
        passive:false
    }
);

    63:["🌧️","Дождь"],

    96:["⛈️","Гроза с градом"],
    99:["⛈️","Сильная гроза с градом"]

};


function getWeather(code){

    return (
        weatherCodes[code] ||
        ["🌡️","Неизвестно"]
    );

}


function getWindDirection(deg){

    const directions = [
        "С",
        "СВ",
        "В",
        "ЮВ",
        "Ю",
        "ЮЗ",
        "З",
        "СЗ"
    ];


    return directions[
        Math.round(deg/45)%8
    ];

}


/* =====================================================
   CITY
===================================================== */

async function searchCity(){

    const input =
        document.getElementById(
            "cityInput"
        );


    const city =
        input.value.trim();


    if(!city)
        return;


    document
        .getElementById("error")
        .style.display="none";


    document
        .getElementById("weather")
        .innerHTML=`

<div style="
padding:30px;
text-align:center;
color:#8496a9;
">
Загрузка прогноза...
</div>

`;


    try{

        const response =
            await fetch(
                "https://geocoding-api.open-meteo.com/v1/search" +
                "?name=" +
                encodeURIComponent(city) +
                "&count=1" +
                "&language=ru" +
                "&format=json"
            );


        const data =
            await response.json();


        if(
            !data.results ||
            !data.results.length
        ){

            throw new Error();

        }


        const place =
            data.results[0];


        latitude =
            place.latitude;

        longitude =
            place.longitude;


        document
            .getElementById(
                "locationStatus"
            )
            .textContent =
                place.name;


        previewMap.setView(
            [latitude,longitude],
            6,
            {
                animate:false
            }
        );


        forecastMap.setView(
            [latitude,longitude],
            6,
            {
                animate:false
            }
        );


        updateMarker();

        await loadWeather(
            place.name
        );

    }
    catch(e){

        document
            .getElementById(
                "locationStatus"
            )
            .textContent =
                "Город не выбран";


        document
            .getElementById(
                "error"
            )
            .textContent =
                "Не удалось найти город";


        document
            .getElementById(
                "error"
            )
            .style.display =
                "block";

    }

}


/* =====================================================
   WEATHER API
===================================================== */

async function loadWeather(city){

    const url =
        "https://api.open-meteo.com/v1/dwd-icon" +

        "?latitude=" +
        latitude +

        "&longitude=" +
        longitude +

        "&current=" +
        "temperature_2m," +
        "relative_humidity_2m," +
        "apparent_temperature," +
        "precipitation," +
        "weather_code," +
        "pressure_msl," +
        "wind_speed_10m," +
        "wind_direction_10m" +

        "&daily=" +
        "weather_code," +
        "temperature_2m_max," +
        "temperature_2m_min," +
        "precipitation_probability_max" +

        "&forecast_days=7" +

        "&timezone=auto";


    try{

        const response =
            await fetch(url);


        if(!response.ok)
            throw new Error();


        const data =
            await response.json();


        renderWeather(
            data,
            city
        );

    }
    catch(e){

        document
            .getElementById(
                "error"
            )
            .textContent =
                "Прогноз временно недоступен";


        document
            .getElementById(
                "error"
            )
            .style.display =
                "block";

    }

}

){

    const c =

    const d =

    const w =
        getWeather(
            c.weather_code
        );


    let html = `

<div>

${city}

    }
)}
</div>

</div>

<div class="weather-icon">
${w[0]}
</div>

</div>

<div class="temperature">
${Math.round(c.temperature_2m)}°
</div>

<div class="description">
${w[1]}
</div>

<div class="details">

</div>

</div>

</div>

</div>

<div class="detail">

</div>
</div>

</div>

</div>

<div class="section-title">

<div class="forecast">

    for(

        i<7;
        i++

        const date =
            new Date(

        const dw =
            getWeather(
                d.weather_code[i]
            );


        const name =
            i === 0
            ? "Сегодня"
            : date.toLocaleDateString(
                "ru-RU",
                {

                }

        html += `

💧 ${d.precipitation_probability_max[i]}%
